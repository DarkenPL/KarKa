<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KarKa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   KARTY – wygląd kart opisują pliki w folderze Szablony (komendy TEKST, OBRAZEK…).
   Tu są tylko wspólne zasady rysowania elementów.
   ═══════════════════════════════════════════════════════════════════════════ */
.karta {
  position: relative; overflow: hidden; break-inside: avoid;
  background: #fff; color: #1d1b19;
  font-family: "EB Garamond", Georgia, serif; font-size: 10pt; line-height: 1.15;
}
.el { position: absolute; box-sizing: border-box; }
.el.tekst { display: flex; flex-direction: column; overflow: hidden; }
.el.tekst > .tresc { flex: none; min-width: 0; }
.el.jedna-linia > .tresc { white-space: nowrap; }
.el.obrazek img { width: 100%; height: 100%; display: block; }
.el.ikony { display: flex; overflow: hidden; }
.el.ikony .ikona { height: 100%; width: auto; vertical-align: 0; }
.el.ikony .ikona-kolor { height: 100%; width: auto; aspect-ratio: 1.42; }
.ikona { height: calc(var(--ik, 0.9) * 1em); width: auto; vertical-align: -0.15em; }
.odstep { display: inline-block; width: 0.25em; }
/* Prostokąt w kolorze z palety, rysowany kodem: {kolor-nazwa}, {kolor-nazwa-mix} */
.ikona-kolor {
  display: inline-block; width: 1.35em; height: 0.95em; vertical-align: -0.15em; box-sizing: border-box;
  border: 0.08em solid #000; border-radius: 0.08em;   /* czysta czerń – w druku K100, nie rich black */
  background: linear-gradient(to bottom, var(--k) 0 var(--p, 100%), #fff var(--p, 100%) 100%);
}
.karta b, .karta strong { font-weight: 600; }
/* Rozmiary w treści pola (#71): <small>/<big> względem otoczenia, <rozmiar=N> względem rozmiaru pola.
   --pole = rozmiar pola po dopasowaniu (fitAll zmienia font-size pola), więc wszystko skaluje się razem. */
@property --pole { syntax: '<length>'; inherits: true; initial-value: 0px; }
.el.tekst { --pole: 1em; }
.karta small { font-size: 0.6em; }
.karta big { font-size: 1.4em; }
/* Akapity (#71 b): wiersz z <lewo>/<środek>/<prawo> albo z listy (lista=tak) staje się blokiem .akapit;
   pola bez tych znaczników mają dawny HTML (wiersze rozdzielone <br>). Lista: punktor/numer w osobnej
   kolumnie, kolejne linie tekstu równo za nim (wcięcie wiszące). */
.karta .akapit.lista { display: flex; align-items: baseline; }
.karta .akapit.lista > .punkt { flex: none; white-space: pre; }
.karta .akapit.lista > .wiersz { flex: 1 1 0; min-width: 0; }

/* ═══════════════════════════════════════════════════════════════════════════
   Interfejs (bez wpływu na wydruk)
   ═══════════════════════════════════════════════════════════════════════════ */
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #ece9e4; color: #222; }
.pasek {
  position: sticky; top: 0; z-index: 5;
  display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
  padding: 10px 16px; background: #fbfaf8; border-bottom: 1px solid #d8d3cb;
}
.pasek .odstep, .stan .odstep { flex: 1; }
.stan { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; font-size: 12px; color: #6b655d; min-height: 20px; }
.stan button { font-size: 12px; padding: 1px 8px; }
.okno { border: 1px solid #c9c2b8; border-radius: 10px; padding: 18px 22px; min-width: 380px; max-width: 560px; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
.okno::backdrop { background: rgba(40,35,30,.25); }
.okno h3 { margin: 0 0 12px; font-size: 16px; }
.okno fieldset { border: 0; padding: 0; margin: 0 0 12px; }
.okno legend { font-weight: 600; font-size: 13px; margin-bottom: 4px; padding: 0; }
.okno fieldset label { display: flex; margin: 3px 0; font-size: 13px; }
.okno .opis { color: #8a8378; font-size: 12px; }
.okno .talie { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.okno-przyciski { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
button, select { font: inherit; padding: 6px 12px; border: 1px solid #c9c2b8; border-radius: 6px; background: #fff; cursor: pointer; }
button.glowny { background: #c8463f; border-color: #c8463f; color: #fff; }
.okno-przyciski button.domyslny { background: #4a453f; border-color: #4a453f; color: #fff; }
button:disabled { opacity: .45; cursor: default; }
label { display: inline-flex; gap: 6px; align-items: center; }
.status { color: #6b655d; font-size: 13px; }
.uwagi { margin: 12px 16px 0; padding: 10px 14px; background: #fff4e0; border: 1px solid #f0d3a0; border-radius: 6px; font-size: 13px; display: none; }
.uwagi.widoczne { display: block; }
.raport { margin: 12px 16px 0; padding: 10px 14px; background: #eef4fb; border: 1px solid #c6d8ee; border-radius: 6px; font-size: 13px; }
.raport h3 { margin: 10px 0 4px; font-size: 14px; }
.raport h3:first-of-type { margin-top: 0; }
.raport ul { margin: 2px 0 0; padding-left: 18px; }
.raport .ok { color: #2f7d4a; }
.raport .zamknij { float: right; }
.raport .raport-drukarnia { display: block; margin-bottom: 8px; }
.uwagi ul { margin: 4px 0 0; padding-left: 18px; }
.start { max-width: 600px; margin: 60px auto; padding: 24px 28px; background: #fff; border-radius: 10px; border: 1px solid #ddd6cc; }
.start h2 { margin-top: 0; }
.start code { background: #f3f0eb; padding: 1px 5px; border-radius: 4px; }
.talia-tytul { margin: 18px 16px 0; font-size: 15px; color: #4a453f; }
.rewers-podglad { position: relative; }        /* zajmuje dokładnie miejsce karty – siatka się nie rozjeżdża */
.rewers-podglad .etykieta {
  position: absolute; left: 50%; bottom: 7mm; transform: translateX(-50%); pointer-events: none;
  font-size: 11px; line-height: 1; padding: 3px 8px; border-radius: 10px;
  background: rgba(255,255,255,.85); color: #4a453f; box-shadow: 0 1px 2px rgba(0,0,0,.2);
}
.siatka { display: flex; flex-wrap: wrap; gap: 14px; padding: 12px 16px 16px; align-items: flex-start; }
.siatka .karta { box-shadow: 0 1px 4px rgba(0,0,0,.18); border-radius: 2mm; }
.siatka .karta.za-dlugi { outline: 2px dashed #d00; outline-offset: 3px; }
.siatka .karta:not(.rewers) { cursor: pointer; }
.siatka .karta.wybrana { outline: 3px solid #2f6fd6; outline-offset: 3px; }
.siatka .karta.zmieniona { box-shadow: 0 0 0 3px #e8912d; }
.siatka .karta.nowa { box-shadow: 0 0 0 3px #3aa55d; }
.legenda-zm { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin: 0 2px 0 6px; }
.historia .wiersz { padding: 5px 0; border-top: 1px solid #d6e2f0; }
.historia .wiersz button { font-size: 12px; padding: 1px 8px; margin-left: 4px; }
.historia .opis { color: #555; font-size: 12px; }
.historia .punkt { background: #fff2c9; border-radius: 3px; padding: 0 5px; margin-left: 4px; }
.historia pre.diff { background: #fff; border: 1px solid #d6e2f0; padding: 6px 8px; font-size: 11.5px; max-height: 320px; overflow: auto; margin: 4px 0; }
.diff .dod { background: #e3f6e6; color: #1d6b31; display: block; }
.diff .usu { background: #fde8e4; color: #a12a1a; display: block; }
.diff .kon { color: #888; display: block; }
.wersja-baner { margin: 12px 16px 0; padding: 8px 14px; background: #ffe7b8; border: 1px solid #e8b75c; border-radius: 6px; font-size: 13px; }
.porownanie .para { display: inline-flex; gap: 10px; align-items: flex-start; margin: 6px 18px 12px 0; vertical-align: top; }
.porownanie .para > div { text-align: center; font-size: 11px; color: #555; }
.porownanie .para .karta { margin-top: 3px; box-shadow: 0 1px 4px rgba(0,0,0,.18); }
#wybor { font-size: 12px; background: #e3edfb; border-radius: 4px; padding: 2px 4px 2px 8px; }
/* Tryb szkicu (tylko wydruk): bez teł i obrazków, tekst czarny, ikony w szarościach. */
#druk.szkic .karta { background: #fff !important; }
#druk.szkic .el.ksztalt { background: none !important; border: 0.2mm solid #999 !important; }
#druk.szkic .el.obrazek { border: 0.2mm dashed #bbb; }
#druk.szkic .el.obrazek img { display: none; }
#druk.szkic .el.obrazek.tlo { display: none; }
#druk.szkic .el.tekst, #druk.szkic .el.tekst * { color: #000 !important; }
#druk.szkic img { filter: grayscale(1); }
#druk { display: none; }

/* ── Edytor szablonu (panel po lewej) ── */
:root { --pasek-h: 56px; --ed-w: 44vw; }
#edytor {
  position: fixed; left: 0; top: var(--pasek-h); bottom: 0; width: var(--ed-w); min-width: 360px; z-index: 4;
  display: flex; flex-direction: column; background: #fbfaf8; border-right: 1px solid #d8d3cb;
}
#edytor[hidden] { display: none; }
body.z-edytorem #podglad, body.z-edytorem .uwagi, body.z-edytorem .start, body.z-edytorem .raport, body.z-edytorem .wersja-baner { margin-left: calc(max(var(--ed-w), 360px) + 16px); }
.ed-pasek { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-bottom: 1px solid #e3ded6; font-size: 13px; }
.ed-pasek b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ed-pasek #edStan { color: #6b655d; flex: 1; }
.ed-pasek #edStan.zmiany { color: #b5571a; }
.ed-pasek button { padding: 4px 10px; }
.ed-baner { padding: 8px 12px; font-size: 13px; background: #fff4e0; border-bottom: 1px solid #f0d3a0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ed-baner[hidden] { display: none; }
.ed-baner button { padding: 3px 9px; font-size: 12px; }
.ed-obszar { flex: 1; min-height: 0; display: flex; background: #fff; }
.ed-numery, .ed-tekst pre, .ed-tekst textarea {
  font: 12.5px/1.6 ui-monospace, "SF Mono", Menlo, Consolas, monospace; tab-size: 2;
}
.ed-numery { width: 44px; flex: none; overflow: hidden; padding: 10px 6px 10px 0; text-align: right; color: #a39b90; background: #f6f3ee; border-right: 1px solid #ebe6de; user-select: none; }
.ed-numery div { height: 1.6em; padding-right: 2px; }
.ed-numery div.blad { color: #c0392b; font-weight: 600; background: #fde8e4; }
.ed-tekst { position: relative; flex: 1; min-width: 0; overflow: hidden; }
.ed-tekst pre, .ed-tekst textarea {
  position: absolute; inset: 0; margin: 0; padding: 10px 12px; border: 0; white-space: pre; overflow: auto;
}
.ed-tekst pre { pointer-events: none; color: #2b2925; }
.ed-tekst pre .l { min-height: 1.6em; }
.ed-tekst pre .l.blad { background: #fde8e4; box-shadow: inset 3px 0 #e05a47; }
.ed-tekst textarea { color: transparent; background: transparent; caret-color: #1d1b19; resize: none; outline: none; }
.ed-tekst textarea::selection { background: rgba(70,130,220,.28); color: transparent; }
.ed-tekst textarea[readonly] { caret-color: transparent; }
.sk-kom { color: #8a8378; font-style: italic; }
.sk-sek { color: #7b3fa0; font-weight: 600; }
.sk-kmd { color: #1f5fa8; font-weight: 600; }
.sk-opc { color: #2f7d4a; }
.sk-str { color: #a1491a; }
.sk-pole { color: #b0326a; font-weight: 600; }
.sk-ikona { color: #8a6d00; font-weight: 600; }
.sk-liczba { color: #0b7285; }
.sk-kolor { border-bottom: 3px solid var(--sw); }
.ed-bledy { max-height: 30%; overflow: auto; border-top: 1px solid #e3ded6; font-size: 12px; background: #fff8f6; }
.ed-bledy:empty { display: none; }
.ed-bledy div { padding: 4px 12px; cursor: pointer; border-bottom: 1px solid #f6e0dc; }
.ed-bledy div:hover { background: #fde8e4; }
.ed-bledy b { color: #c0392b; margin-right: 6px; }
button.wlaczony { background: #4a453f; border-color: #4a453f; color: #fff; }

/* ═══════════════════════════════════════════════════════════════════════════
   Druk
   ═══════════════════════════════════════════════════════════════════════════ */
@media print {
  body { background: #fff; }
  .pasek, .uwagi, #podglad, .start, #edytor { display: none !important; }
  #druk { display: block; }
  .arkusz { position: relative; break-after: page; overflow: hidden; margin: 0; }
  html, body { margin: 0 !important; padding: 0 !important; }
  .arkusz:last-child { break-after: auto; }
  .uklad { display: grid; }
  .znacznik { position: absolute; background: #000; }
  .linia-ciecia { position: absolute; z-index: 2; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
<style id="styl-strony"></style>
<style id="czcionki-szablonow"></style>
</head>
<body>

<div class="pasek" id="pasek">
  <button id="edytorPrzycisk" disabled title="Edytor szablonu (⌥⌘E)">Edytor</button>
  <button id="historiaPrzycisk" disabled title="Historia wersji szablonu i plików danych">Historia</button>
  <button id="raportPrzycisk" disabled title="Duplikaty ID, puste pola, nieużywane kolumny, obrazki i ikony">Raport</button>
  <label title="Które talie pokazać w podglądzie">Talia: <select id="filtr"><option value="">Wszystkie talie</option></select></label>
  <span class="odstep"></span>
  <button class="glowny" id="obrazkiPrzycisk" disabled title="Każda karta jako osobny obrazek w folderze Export projektu (⌘E)">Eksport obrazków…</button>
  <div class="stan">
    <span class="status" id="status"></span>
    <span class="odstep"></span>
    <span id="zmiany" hidden title="Karty zmienione (pomarańczowa obwódka) albo nowe (zielona) od ostatniego zapisanego PDF"><span class="legenda-zm" style="background:#e8912d"></span><b id="zmLiczba"></b> zmienione <span class="legenda-zm" style="background:#3aa55d"></span><b id="noweLiczba"></b> nowe <button id="porownaj">Porównaj</button></span>
    <span id="wybor" hidden title="Kliknij kartę, żeby ją zaznaczyć (Shift – zakres). W oknach druku i eksportu możesz wybrać tylko zaznaczone."><b id="wyborLiczba"></b> zaznaczone <button id="wyborCzysc">Wyczyść</button></span>
  </div>
</div>
<dialog id="okno" class="okno"><form id="oknoForm" autocomplete="off"><h3 id="oknoTytul"></h3><div id="oknoPola"></div><div class="okno-przyciski" id="oknoPrzyciski"></div></form></dialog>
<div class="uwagi" id="uwagi"></div>
<div class="raport" id="raport" hidden></div>
<div class="raport porownanie" id="porownanie" hidden></div>
<div class="raport historia" id="historia" hidden></div>
<div class="wersja-baner" id="wersjaBaner" hidden></div>

<div id="edytor" hidden>
  <div class="ed-pasek"><b id="edNazwa">Szablon</b><span id="edStan"></span><button id="edZapisz" disabled title="⌘S">Zapisz</button></div>
  <div class="ed-baner" id="edKonflikt" hidden>Plik szablonu zmienił się na dysku.
    <button id="edWczytaj">Wczytaj z dysku</button><button id="edZostaw">Zostaw moją wersję</button></div>
  <div class="ed-baner" id="edTylkoOdczyt" hidden>Przykład jest tylko do odczytu. Żeby go zmieniać, utwórz <b>Nowy projekt…</b> albo skopiuj folder przykładu.</div>
  <div class="ed-obszar">
    <div class="ed-numery" id="edNumery"></div>
    <div class="ed-tekst"><pre id="edKolory" aria-hidden="true"></pre><textarea id="edPole" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off"></textarea></div>
  </div>
  <div class="ed-bledy" id="edBledy"></div>
</div>

<div class="start" id="start"><p>Wczytywanie…</p></div>

<div id="podglad"></div>
<div id="druk"></div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════════════════
// USTAWIENIA
// ═══════════════════════════════════════════════════════════════════════════
const CONFIG = {
  // Nazwy kolorów i plik pokoju playingcards.io ustawia się w szablonach:
  // KOLOR = nazwa, #RRGGBB
  plikIkon: 'ikony.csv',
  odstep: true,                            // odstęp po ikonach z "Odstęp = tak"
  minSkalaTekstu: 0.6,                     // domyślnie najmniej 60% rozmiaru, gdy tekst się nie mieści
  jpgDpi: 150,                             // rozdzielczość obrazków kart (eksport JPG i playingcards.io)
  jpgJakosc: 0.92,                         // jakość JPG (0–1)
  // Ikony wbudowane (bez ikony.csv). Znacznik: [plik, odstęp po ikonie, znak zastępczy gdy pliku brak]
  ikonyDomyslne: {},
};

// Paleta nazwanych kolorów i plik pokoju playingcards.io – zbierane z szablonów przy każdym odświeżeniu.
let PALETA = {};
let PROJEKT = 'NowaGra';     // nazwa projektu: PROJEKT = … w szablonie, inaczej nazwa pliku szablonu
let WERSJA = '';             // WERSJA = … w szablonie – pole [_wersja] na kartach

// ═══════════════════════════════════════════════════════════════════════════
const $ = (id) => document.getElementById(id);
const norm = (s) => String(s).normalize('NFC').toLowerCase().replace(/\\/g, '/').replace(/^\.\//, '');
const iconKey = (s) => String(s || '').replace(/[{}:\s]/g, '').toLowerCase();
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let files = new Map();       // ścieżka (znormalizowana, względem folderu projektu) → File
let urls = [];
let lastStamp = '';

// ── Wczytywanie projektu ─────────────────────────────────────────────────────
// Aplikacja podaje pliki folderu projektu przez lokalny serwer; ?szablon= wskazuje otwarty plik
// szablonu (względem folderu projektu), a szablon wskazuje pozostałe pliki (DANE, obrazki, czcionki).
const SZABLON = new URLSearchParams(location.search).get('szablon') || '';
let serverPaths = [];          // ścieżki wczytanych plików (do sprawdzania zmian)
let serverWanted = [];         // pliki wskazane w szablonie, których jeszcze nie ma

const encodePath = (rel) => rel.split('/').map(encodeURIComponent).join('/');

async function fetchFile(rel) {
  try {
    const r = await fetch(encodePath(rel), { cache: 'no-store' });
    if (!r.ok) return null;
    const lm = Date.parse(r.headers.get('Last-Modified') || '') || Date.now();
    const blob = await r.blob();
    return new File([blob], rel.split('/').pop(), { lastModified: lm, type: blob.type });
  } catch (e) { return null; }
}

// Pliki, do których odwołuje się szablon wprost (czcionki, obrazki, pliki danych).
const PLIK_RE = /\.(png|jpe?g|gif|webp|svg|ttf|otf|woff2?|csv|xlsx)$/i;

// tylkoNowe: podgląd na żywo z edytora – pliki już wczytane bierzemy z pamięci, pobieramy tylko nowe.
async function loadFromServer({ tylkoNowe = false } = {}) {
  const next = new Map(), paths = [];
  const put = async (rel) => {
    rel = String(rel || '').trim();
    if (!rel || next.has(norm(rel))) return;
    const f = (tylkoNowe && rel !== SZABLON && files.get(norm(rel))) || await fetchFile(rel);
    if (f) { next.set(norm(rel), f); paths.push(rel); }
  };
  // 1) szablon – z dysku, a gdy w edytorze są niezapisane zmiany: z edytora
  await put(SZABLON);
  let tf = next.get(norm(SZABLON));
  if (tf) {
    const zDysku = await tf.text();
    const tekst = edytorZDysku(zDysku);
    if (tekst !== zDysku) { tf = new File([tekst], tf.name, { lastModified: Date.now() }); next.set(norm(SZABLON), tf); }
  }
  // 2) pliki danych i inne pliki wskazane w szablonie
  const refs = new Set([CONFIG.plikIkon]);
  if (tf) {
    const t = parseTemplate(await tf.text(), tf.name);
    t.dane.forEach((d) => refs.add(plikDanych(d)[0]));
    t.pliki.forEach((d) => refs.add(d));
  }
  await Promise.all([...refs].map(put));
  // 3) obrazki i ikony, do których odwołują się dane, oraz ikony z folderów Ikony/ i Icons/
  const imgs = new Set(Object.values(CONFIG.ikonyDomyslne).map((v) => v[0]));
  ikonyZFolderow = await znajdzIkony();
  spisIkon = JSON.stringify(ikonyZFolderow);
  ikonyZFolderow.forEach((x) => imgs.add(x.plik));
  const ik = next.get(norm(CONFIG.plikIkon));
  if (ik) for (const r of parseCSV(await ik.text())) if (r['Plik']) imgs.add(r['Plik']);
  for (const [k, f] of [...next]) {
    if (!/\.(csv|xlsx)$/.test(k) || k === norm(CONFIG.plikIkon)) continue;
    try { for (const r of await readTable(f, '*')) for (const v of Object.values(r)) if (PLIK_RE.test(v)) imgs.add(v); } catch (e) {}
  }
  await Promise.all([...imgs].map(put));
  serverWanted = [...refs].filter((r) => !next.has(norm(r)));
  files = next; serverPaths = paths;
  await build();
  if (!tylkoNowe) zapiszHistorie();
}

// Odcisk plików projektu. Listy są sortowane: pliki wczytują się równolegle, więc kolejność w serverPaths
// bywa za każdym razem inna – bez sortowania każde przeładowanie zmieniało odcisk i odświeżanie kręciło się w kółko.
async function serverStamp() {
  const heads = await Promise.all([...serverPaths].sort().map(async (rel) => {
    try {
      const r = await fetch(encodePath(rel), { method: 'HEAD', cache: 'no-store' });
      return rel + (r.ok ? (r.headers.get('Last-Modified') || '') + r.headers.get('Content-Length') : 'x');
    } catch (e) { return rel + '?'; }
  }));
  // Pliki wskazane w szablonie, których jeszcze nie było, też sprawdzamy.
  const extra = await Promise.all([...serverWanted].sort().map(async (n) => {
    try { const r = await fetch(encodePath(n), { method: 'HEAD', cache: 'no-store' }); return r.ok ? n : ''; } catch (e) { return ''; }
  }));
  const ikony = JSON.stringify(await znajdzIkony());              // nowy plik w Ikony/ też odświeża karty
  return heads.join('|') + '#' + extra.join('|') + '#' + ikony;
}

let AUTO_ODSWIEZANIE = true;      // menu Widok → Odświeżaj automatycznie
window.ustawAuto = (b) => { AUTO_ODSWIEZANIE = !!b; };
window.odswiezKarty = () => loadFromServer();
$('filtr').onchange = applyFilter;

// Automatyczne odświeżanie: co 1,5 s sprawdzamy daty zmian wczytanych plików (jedno sprawdzenie naraz).
let SPRAWDZANIE = false;
let TIK_UKRYTE = 0;
let ZLECENIE_TRWA = false, ZLECENIE_Z_DYSKU = false;   // zlecenie z pliku – bez automatycznego odświeżania w trakcie
async function sprawdzZmianyPlikow(teraz = false) {
  // Okno ukryte (także całkiem zasłonięte innym oknem albo na innym biurku – macOS) – rzadziej, co ~9 s (issue #30).
  if (!teraz && document.hidden && ++TIK_UKRYTE % 6) return;
  if (SPRAWDZANIE || !AUTO_ODSWIEZANIE || !serverPaths.length || PODGLAD_WERSJI || EKSPORT_TRWA || ZLECENIE_TRWA) return;
  SPRAWDZANIE = true;
  try {
    const stamp = await serverStamp();
    if (lastStamp && stamp !== lastStamp) await loadFromServer();
    lastStamp = lastStamp && stamp !== lastStamp ? await serverStamp() : stamp;
  } finally { SPRAWDZANIE = false; }
}
setInterval(sprawdzZmianyPlikow, 1500);
document.addEventListener('visibilitychange', () => { if (!document.hidden) sprawdzZmianyPlikow(true); });   // powrót do okna – od razu

// ── CSV / XLSX ───────────────────────────────────────────────────────────────

function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/, 1)[0];
  const sep = (first.split(';').length >= first.split(',').length) ? ';' : ',';
  const rows = []; let row = [], field = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; } else field += c; }
    else if (c === '"') q = true;
    else if (c === sep) { row.push(field); field = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(field); rows.push(row); row = []; field = ''; }
    else field += c;
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return toObjects(rows);
}
function toObjects(rows) {
  rows = rows.filter((r) => r.some((v) => String(v ?? '').trim() !== ''));
  if (!rows.length) return [];
  const head = rows[0].map((h) => String(h ?? '').trim());
  return rows.slice(1).map((r) => Object.fromEntries(head.map((h, i) => [h, String(r[i] ?? '').trim()])));
}
async function loadScript(src) {
  return new Promise((ok, fail) => {
    const s = document.createElement('script'); s.src = src; s.onload = ok;
    s.onerror = () => fail(new Error('Nie można wczytać ' + src + ' (brak internetu?)'));
    document.head.appendChild(s);
  });
}
// arkusz: nazwa arkusza XLSX (bez wielkości liter i polskich znaków), '' = pierwszy, '*' = wszystkie razem.
async function readTable(file, arkusz = '') {
  if (/\.xlsx$/i.test(file.name)) {
    if (!window.XLSX) await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    const czytaj = (n) => toObjects(XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: false, defval: '' }));
    if (arkusz === '*') return wb.SheetNames.flatMap(czytaj);
    let n = wb.SheetNames[0];
    if (arkusz) {
      n = wb.SheetNames.find((x) => plain(x).toLowerCase().trim() === plain(arkusz).toLowerCase().trim());
      if (!n) throw new Error(`nie ma arkusza „${arkusz}” (arkusze: ${wb.SheetNames.join(', ')})`);
    }
    return czytaj(n);
  }
  return parseCSV(await file.text());
}

// ── Wspólne elementy kart ────────────────────────────────────────────────────

function fileUrl(rel) {
  const f = files.get(norm(rel));
  if (!f) return null;
  // SVG wyświetla się tylko z właściwym typem pliku (PNG/JPG przeglądarka rozpozna sama).
  const svg = /\.svg$/i.test(rel) && f.type !== 'image/svg+xml';
  const u = URL.createObjectURL(svg ? new Blob([f], { type: 'image/svg+xml' }) : f); urls.push(u);
  URL_PLIK.set(u, rel + '@' + f.lastModified + ':' + f.size);      // do odcisku karty (zmiana obrazka = zmiana karty)
  return u;
}

// Ikony z folderów Ikony/ i Icons/ – każdy plik obrazka to znacznik {nazwa_pliku} (bez ikony.csv).
const FOLDERY_IKON = ['Ikony', 'Icons'];
const OBRAZ_RE = /\.(png|jpe?g|gif|webp|svg)$/i;
let ikonyZFolderow = [];       // [{ klucz, plik }]
let spisIkon = '';             // do wykrywania nowych plików ikon

async function spisFolderu(dir) {
  try {
    const r = await fetch(encodePath(dir) + '/', { cache: 'no-store' });
    if (!r.ok) return [];
    const l = await r.json();
    return Array.isArray(l) ? l : [];
  } catch (e) { return []; }
}
async function znajdzIkony() {
  const wynik = [];
  for (const dir of FOLDERY_IKON)
    for (const n of await spisFolderu(dir)) if (OBRAZ_RE.test(n)) wynik.push({ klucz: n.replace(OBRAZ_RE, ''), plik: dir + '/' + n });
  return wynik;
}

async function loadIcons(warn) {
  const icons = {};
  for (const { klucz, plik } of ikonyZFolderow) {
    const k = iconKey(klucz);
    icons[k] = { plik, odstep: true, znak: '' };
    if (!icons[plain(k)]) icons[plain(k)] = icons[k];          // {ogien} = {ogień}
  }
  for (const [k, [plik, odstep, znak]] of Object.entries(CONFIG.ikonyDomyslne)) icons[k] = { plik, odstep, znak: znak || '' };
  const f = files.get(norm(CONFIG.plikIkon));
  if (f) {
    for (const r of parseCSV(await f.text())) {
      const k = iconKey(r['Znacznik']); if (!k) continue;
      const prev = icons[k] || { plik: '', odstep: false, znak: '' };
      icons[k] = {
        plik: r['Plik'] || prev.plik,
        odstep: r['Odstęp'] === undefined ? prev.odstep : /^(tak|t|1|x|yes)$/i.test(r['Odstęp']),
        znak: r['Znak'] || prev.znak,
      };
    }
  }
  for (const k in icons) icons[k].url = fileUrl(icons[k].plik);
  return icons;
}

function color(value, label, warn) {
  const v = String(value || '').trim();
  if (!v) return null;
  const named = PALETA[v.toLowerCase()] || PALETA[plain(v)];
  if (named) return named;
  if (/^(brak|przezroczysty|none|transparent)$/i.test(v)) return 'transparent';
  if (/^#?([0-9a-f]{3,4}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(v)) return '#' + v.replace('#', '');
  if (/^(rgba?|hsla?)\([^()]*\)$/i.test(v)) return v;
  warn.add(label + ': nieznany kolor „' + v + '”');
  return null;
}

// Tekst ze znacznikami {fire} → HTML z obrazkami ikon; nowa linia w komórce = nowa linia na karcie.
function renderText(text, icons, warn) {
  let out = '';
  const re = /\{([^{}]+)\}/g; let last = 0, m;
  while ((m = re.exec(text))) {
    out += esc(text.slice(last, m.index));
    const key = iconKey(m[1]);
    const ic = icons[key];
    // {kolor-nazwa} / {kolor-nazwa-mix} – prostokąt w kolorze z palety (KOLOR = …), rysowany kodem.
    // {osiag-…} działa tak samo (starsza nazwa).
    const sw = /^(?:kolor|osiag)-(.+?)(-mix)?$/.exec(key);
    const swc = sw && (PALETA[sw[1]] || PALETA[plain(sw[1])]);
    if (swc) {
      out += `<span class="ikona-kolor" style="--k:${swc};${sw[2] ? '--p:45%' : ''}" title="${esc(m[1])}"></span>`;
    } else if (ic && ic.url) {
      out += `<img class="ikona" src="${ic.url}" alt="${esc(m[1])}">`;
      if (CONFIG.odstep && ic.odstep && text[re.lastIndex] === '{') out += '<span class="odstep"></span>';
    } else if (ic) {
      // Brak pliku – zastępczo znak (emoji), żeby karta nadal była czytelna.
      warn.add('Brak pliku ikony: ' + ic.plik + (ic.znak ? ' (użyto ' + ic.znak + ')' : ''));
      out += esc(ic.znak || m[0]);
    } else {
      warn.add('Nieznany znacznik: ' + m[0] + ` – dodaj plik Ikony/${m[1].trim()}.svg (albo .png) lub wpis w ikony.csv`);
      out += esc(m[0]);
    }
    last = re.lastIndex;
  }
  return (out + esc(text.slice(last))).replace(/\r?\n/g, '<br>');
}

// ── Szablony talii (folder Szablony, w stylu nanDecka) ──────────────────────
// Każdy plik .txt to jedna talia: komendy KOMENDA = argumenty, wymiary w mm,
// [Kolumna] wstawia wartość z pliku danych. Pełny opis: Szablony/_opis_komend.txt.

const plain = (s) => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ł/g, 'l').replace(/Ł/g, 'L')
  .toLowerCase().trim().replace(/[\s-]+/g, '_');
const ELEMENTY = ['tlo', 'prostokat', 'elipsa', 'tekst', 'obrazek', 'ikona', 'linia'];
const FLAGI = ['jedna_linia', 'pogrubienie', 'kursywa', 'podkreslenie', 'wersaliki', 'bez_formatowania'];

function stripComment(line) {
  let q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"' && line[i - 1] !== '\\') q = !q;
    else if (!q && (c === ';' || (c === '/' && line[i + 1] === '/')) && /\s/.test(line[i - 1] || ' ')) return line.slice(0, i);
  }
  return line;
}
// Dzieli argumenty po przecinkach – poza cudzysłowami i nawiasami [ ] { } ( ).
function splitArgs(s) {
  const out = []; let cur = '', q = false, depth = 0;
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (q) { if (c === '\\' && i + 1 < s.length) { cur += c + s[++i]; continue; } if (c === '"') q = false; cur += c; continue; }
    if (c === '"') { q = true; cur += c; continue; }
    if ('[{('.includes(c)) depth++; else if (']})'.includes(c)) depth--;
    if (c === ',' && depth <= 0) { out.push(cur.trim()); cur = ''; continue; }
    cur += c;
  }
  if (cur.trim() !== '' || out.length) out.push(cur.trim());
  return out;
}
function unq(a) {
  a = String(a).trim();
  if (a.length >= 2 && a[0] === '"' && a[a.length - 1] === '"')
    return { v: a.slice(1, -1).replace(/\\n/g, '\n').replace(/\\"/g, '"').replace(/\\\\/g, '\\'), q: true };
  return { v: a, q: false };
}
// Liczba w mm (albo pt przy rozmiarze); można pisać działania, np. 88 - 1.6 - 10.35.
function num(v) {
  if (v === undefined || v === null) return NaN;
  const s = String(v).trim().replace(/\s*(mm|pt)$/i, '');
  if (!s || !/^[\d.\s+\-*/()]+$/.test(s)) return NaN;
  try { return Number(Function('"use strict"; return (' + s + ')')()); } catch (e) { return NaN; }
}

// Plik szablonu: jedna talia albo kilka sekcji [TALIA Nazwa]. Wszystko przed pierwszą
// [TALIA …] jest wspólne dla talii z tego pliku (KARTA, CZCIONKA, elementy awersu i rewersu).
function parseTemplate(text, plik) {
  const out = { talie: [], pliki: [], dane: [], czcionki: [], google: [], kolory: [], wersja: '', bledy: [] };
  const nowa = (nazwa, wz) => ({
    plik, nazwa, dane: [], pcio: '', w: wz ? wz.w : 63, h: wz ? wz.h : 88,
    karta: wz ? { ...wz.karta } : {}, kartaRewers: wz ? wz.kartaRewers : undefined,
    awers: wz ? [...wz.awers] : [], rewers: wz ? [...wz.rewers] : [],
  });
  if (/^\s*\{\\rtf/.test(text)) {
    out.bledy.push(`${plik}: plik jest zapisany jako RTF. W TextEdit wybierz Format → Zamień na zwykły tekst i zapisz ponownie.`);
    return out;
  }
  const wspolne = nowa(plik.replace(/\.txt$/i, '').replace(/^\d+[_ .-]*/, ''));
  let t = wspolne, cel = t.awers, font = { flags: new Set() }, fontWspolny = font;

  // Stałe: STAŁA = nazwa, wartość – używane jako [=nazwa] w dowolnym miejscu szablonu (kolejność bez znaczenia).
  const linie = text.replace(/^﻿/, '').split(/\r?\n/);
  const stale = {};
  linie.forEach((raw) => {
    const m = /^\s*([^=;#\[]+?)\s*=\s*([\s\S]*)$/.exec(stripComment(raw));
    if (!m || plain(m[1]) !== 'stala') return;
    const [nazwa, ...reszta] = splitArgs(m[2]);
    if (nazwa) stale[plain(nazwa)] = reszta.map((x) => unq(x).v).join(', ');
  });
  const wstawStale = (t, where) => t.replace(/\[=\s*([^\]]+?)\s*\]/g, (x, n) => {
    if (plain(n) in stale) return stale[plain(n)];
    out.bledy.push(`${where}: nieznana stała [=${n}] (dodaj STAŁA = ${n}, wartość)`);
    return x;
  });

  linie.forEach((raw, i) => {
    const where = `${plik}, wiersz ${i + 1}`;
    let line = raw.trim();
    if (!line || /^(;|#|\/\/)/.test(line)) return;
    line = stripComment(line).trim();
    if (!line) return;
    const sec = /^\[\s*([^\]]+?)\s*\]$|^(\S+)\s*:$/.exec(line);
    if (sec) {
      const head = (sec[1] || sec[2]).trim();
      const talia = /^talia(?:\s+(.+))?$/i.exec(head);
      if (talia) {
        if (t === wspolne) fontWspolny = font;
        t = nowa((talia[1] || '').trim() || `${wspolne.nazwa} ${out.talie.length + 1}`, wspolne);
        out.talie.push(t); cel = t.awers; font = fontWspolny;
        return;
      }
      if (['awers', 'rewers'].includes(plain(head))) { cel = plain(head) === 'rewers' ? t.rewers : t.awers; return; }
    }
    const m = /^([^=]+?)\s*=\s*([\s\S]*)$/.exec(line);
    if (!m) { out.bledy.push(`${where}: nie rozumiem „${line}” (oczekiwano KOMENDA = …)`); return; }
    const kom = plain(m[1]);
    if (kom === 'stala') {
      if (splitArgs(m[2]).length < 2) out.bledy.push(`${where}: STAŁA = nazwa, wartość`);
      return;
    }
    const args = [], opt = {}, flags = new Set();
    for (const a of splitArgs(wstawStale(m[2], where))) {
      const u = unq(a);
      const o = !u.q && /^([\p{L}_][\p{L}\p{N}_ ]*?)\s*=\s*([\s\S]*)$/u.exec(a);
      if (o) opt[plain(o[1])] = unq(o[2]).v;
      else if (!u.q && FLAGI.includes(plain(a))) flags.add(plain(a));
      else args.push(u.v);
    }
    const lit = (v) => { if (v && !/[\[{]/.test(v) && PLIK_RE.test(v)) out.pliki.push(v); };
    switch (kom) {
      case 'nazwa': t.nazwa = args[0] || t.nazwa; break;
      case 'dane': t.dane = args.filter(Boolean); out.dane.push(...t.dane); break;
      case 'pcio': out.bledy.push(`${where}: komenda PCIO nie jest już potrzebna – eksport do playingcards.io tworzy nowy pokój ze wszystkimi taliami. Możesz usunąć ten wiersz.`); break;
      case 'karta': {
        const w = num(args[0]), h = num(args[1]);
        // spad= (#84): spad deklaruje szablon – TŁO i obrazki przy krawędzi to pliki karty ze spadem.
        const zlySpad = opt.spad !== undefined && !(num(String(opt.spad).replace(',', '.')) >= 0 && num(String(opt.spad).replace(',', '.')) <= 10);
        if (cel === t.rewers) {                                        // rewers: własne zaokrąglenie/obwódka, rozmiar i spad jak awers
          if (opt.spad !== undefined) { out.bledy.push(`${where}: spad= wpisz w KARTA awersu – rewers ma ten sam spad`); delete opt.spad; }
          t.kartaRewers = opt; break;
        }
        if (Number.isNaN(w) || Number.isNaN(h)) out.bledy.push(`${where}: KARTA potrzebuje szerokości i wysokości w mm`);
        else { t.w = w; t.h = h; }
        if (zlySpad) { out.bledy.push(`${where}: spad= to liczba mm od 0 do 10, np. KARTA = 63, 88, spad=3`); delete opt.spad; }
        t.karta = opt; break;
      }
      case 'czcionka':
        font = { ...font, ...(args[0] ? { czcionka: args[0] } : {}), ...(args[1] ? { rozmiar: args[1] } : {}), ...opt, flags: new Set(flags) };
        break;
      case 'czcionka_plik':
        if (args.length < 2) { out.bledy.push(`${where}: CZCIONKA_PLIK = "Nazwa", Folder/plik.ttf`); break; }
        out.czcionki.push({ nazwa: args[0], plik: args[1] }); out.pliki.push(args[1]); break;
      case 'czcionka_google': if (args[0]) out.google.push(args[0]); break;
      case 'kolor':
        if (args.length < 2 || !/^#?([0-9a-f]{3,4}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(args[1].trim()))
          out.bledy.push(`${where}: KOLOR = nazwa, #RRGGBB`);
        else out.kolory.push([args[0].trim(), '#' + args[1].trim().replace('#', '')]);
        break;
      case 'stol': out.bledy.push(`${where}: komenda STÓŁ nie jest już potrzebna – eksport do playingcards.io tworzy nowy pokój. Możesz usunąć ten wiersz.`); break;
      case 'projekt': if (args[0]) out.projekt = args[0].trim(); break;
      case 'wersja': out.wersja = (args[0] || '').trim(); break;
      default:
        if (!ELEMENTY.includes(kom)) { out.bledy.push(`${where}: nieznana komenda ${m[1].trim()}`); return; }
        if (kom === 'tekst') {
          const { flags: ff, ...fopt } = font;
          cel.push({ kom, args, opt: { ...fopt, ...opt }, flags: new Set([...ff, ...flags]), where });
        } else cel.push({ kom, args, opt, flags, where });
        if (kom === 'obrazek') lit(args[4]);
        if (kom === 'tlo') lit(args[0]);
    }
  });
  if (!out.talie.length) out.talie.push(wspolne);              // plik bez [TALIA …] = jedna talia
  else if (wspolne.dane.length) out.bledy.push(`${plik}: DANE przed pierwszą [TALIA …] są pomijane – wpisz je w każdej talii.`);
  // Rewers zależny od karty (#47): w [REWERS] jest [Kolumna] albo pole wbudowane karty ([_id], [_numer], [_kopia]) –
  // w argumentach, opcjach (też jeśli=) albo w KARTA rewersu. Inaczej rewers jest wspólny dla talii (jak do 0.6.0).
  const odKarty = (v) => [...String(v ?? '').matchAll(/\[([^\[\]]+)\]/g)].some(([, k]) => {
    k = k.trim();
    if (k.startsWith('=')) return false;                            // nieznana stała – Uwaga jest przy wierszu
    return !k.startsWith('_') || !POLA_TALII.includes(plain(k.slice(1)));
  });
  const wartosci = (c) => [...c.args, ...Object.values(c.opt)];
  for (const t of out.talie) {
    // Spad z szablonu w mm (0 = brak deklaracji – PDF dla drukarni dorabia spad i ostrzega).
    t.spad = t.karta.spad !== undefined ? Math.max(0, num(String(t.karta.spad).replace(',', '.')) || 0) : 0;
    t.rewersZalezny = t.rewers.some((c) => wartosci(c).some(odKarty)) || Object.values(t.kartaRewers || {}).some(odKarty);
    t.rewersPerKopia = t.rewersZalezny && t.rewers.some((c) => wartosci(c).some((v) => /\[\s*_(numer|kopia)\s*\]/i.test(String(v ?? ''))));
  }
  return out;
}
// Pola wbudowane wspólne dla całej talii – rewers, który używa tylko ich, zostaje wspólny.
const POLA_TALII = ['liczba', 'wersja', 'talia', 'projekt', 'data'];

const ALIGN_H = { lewo: 'left', srodek: 'center', prawo: 'right', wyjustuj: 'justify' };
const FLEX_H = { lewo: 'flex-start', srodek: 'center', prawo: 'flex-end', wyjustuj: 'flex-start' };
const FLEX_V = { gora: 'flex-start', srodek: 'center', dol: 'flex-end' };
const POS_H = { lewo: 'left', srodek: 'center', prawo: 'right' };
const POS_V = { gora: 'top', srodek: 'center', dol: 'bottom' };
const GENERYCZNE = /^(serif|sans-serif|monospace|cursive|fantasy|system-ui)$/;
const fontFamily = (v) => String(v).split(',').map((x) => x.trim()).filter(Boolean)
  .map((x) => GENERYCZNE.test(x) ? x : `'${x.replace(/["']/g, '')}'`).join(', ');

function cell(row, k, ctx) {
  // Pola wbudowane: [_numer], [_kopia], [_liczba], [_id], [_wersja], [_talia], [_projekt], [_data]
  if (/^_/.test(k.trim()) && ctx.wbudowane) {
    const v = ctx.wbudowane[plain(k.trim().slice(1))];
    if (v !== undefined) return String(v);
    if (ctx.kolumny) ctx.warn.add(`${ctx.plik}: nieznane pole wbudowane [${k}] – dostępne: [_numer], [_kopia], [_liczba], [_id], [_wersja], [_talia], [_projekt], [_data]`);
    return '';
  }
  if (k in row) return String(row[k] ?? '');
  if (/^=/.test(k.trim())) return '';   // nieznana stała – uwaga jest już przy wierszu szablonu
  const want = k.trim().toLowerCase();
  const hit = Object.keys(row).find((x) => x.trim().toLowerCase() === want);
  if (hit !== undefined) return String(row[hit] ?? '');
  if (ctx.kolumny) ctx.warn.add(`${ctx.plik}: w pliku danych nie ma kolumny [${k}]`);
  return '';
}

// Rysuje jedną kartę (awers albo rewers) według komend szablonu.
// LINIA = x1, y1, x2, y2, grubość=0.3, kolor=…, styl=ciągła|przerywana|kropkowana, początek=…, koniec=…
// Zakończenia: brak, strzałka, strzałka_pełna, kropka, kreska. Rysowane jako geometria SVG w mm (bez <marker>,

    if (!ZAKONCZENIA[z]) { ctx.warn.add(`${c.where}: nieznane zakończenie linii „${nazwa}” – możliwe: brak, strzałka, strzałka_pełna, kropka, kreska`); return 'brak'; } return z; };

    const qx = -ky, qy = kx;

    if (z === 'strzalka_pelna') return `<polygon points="${f(X)},${f(Y)} ${f(X - kx * L + qx * W)},${f(Y - ky * L + qy * W)} ${f(X - kx * L - qx * W)},${f(Y - ky * L - qy * W)}" fill="${kol}"/>`;
    if (z === 'kropka') return `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(Math.max(0.6, g * 1.6))}" fill="${kol}"/>`;
    if (z === 'kreska') return `<line x1="${f(X + qx * W)}" y1="${f(Y + qy * W)}" x2="${f(X - qx * W)}" y2="${f(Y - qy * W)}" stroke="${kol}" stroke-width="${f(g)}"/>`;
    return '';

// ── Formatowanie tekstu (issue #55) ─────────────────────────────────────────
// Szablon: **pogrubienie**, *kursywa*, ~~przekreślenie~~ i znaczniki z ZNACZNIKI_TEKSTU.
// Dane (CSV/XLSX): **pogrubienie**, ~~przekreślenie~~ (para w obrębie jednej komórki) i te same znaczniki;
// pojedyncza * i ~ z danych to zwykłe znaki. Flaga bez_formatowania wyłącza formatowanie z danych.
// Wartości z danych są maskowane znakami sterującymi, żeby wzorce szablonu ich nie łapały:
//   \u0001 = *   \u0002 / \u0003 = ** otwarcie / zamknięcie   \u0004 / \u0005 = ~~ otwarcie / zamknięcie
//   \u0006 = ~   \u0007 = <  (tylko przy bez_formatowania – znacznik z danych zostaje tekstem)
// Rozmiary (#71): <small> = 0,6, <big> = 1,4 rozmiaru otoczenia (zagnieżdżone mnożą się),
// <rozmiar=12>…</rozmiar> = 12 pt przy rozmiarze pola bez zmniejszania (liczony względem pola – --pole w CSS).
const ZNACZNIKI_TEKSTU = ['b', 'strong', 'i', 'em', 'u', 's', 'del', 'strike', 'small', 'big', 'rozmiar'];

const ZNACZNIKI_AKAPITU = ['lewo', 'środek', 'srodek', 'prawo'];

  .replace(/\u0001/g, '*').replace(/\u0006/g, '~').replace(/\u0007/g, '<');

// zamknięcie bez otwarcia zostaje tekstem. Zwraca { html, niedomkniete[], nadmiarowe[] }.
function znacznikiTekstu(html, pt) {
  const stos = [], nadmiarowe = [], zle = [];      // stos: { n, otw } – otw = znacznik otwierający (do ponownego otwarcia)
  const out = html.replace(ZNACZNIK_RE, (m, zam, nazwa, arg) => {
    const n = nazwa.toLowerCase();
    if (!zam) {
      let otw = `<${n}>`;
      if (n === 'rozmiar') {
        const r = liczbaZTekstu(String(arg ?? '').replace(/pt$/i, ''));
        if (!(r > 0)) { zle.push(m.replace(/&lt;/g, '<').replace(/&gt;/g, '>')); return m; }

      stos.push({ n, otw }); return otw;

    if (arg !== undefined) return m;
    const zamknij = (x) => (x.n === 'rozmiar' ? '</span>' : `</${x.n}>`);

    const wewn = stos.splice(i);                      // zamykamy też znaczniki otwarte w środku i otwieramy je ponownie
    const ten = wewn.shift();
    stos.push(...wewn);
    return wewn.slice().reverse().map(zamknij).join('') + zamknij(ten) + wewn.map((x) => x.otw).join('');
  });

  return { html: out + domkniecie, niedomkniete: stos.map((x) => x.n), nadmiarowe, zle };

// ── Akapity (#71 b) ─────────────────────────────────────────────────────────
// Działa na HTML-u po renderText (wiersze rozdzielone <br>, znaczniki szablonu jeszcze jako &lt;…&gt;).
const WYROWNANIA_AKAPITU = { lewo: 'left', srodek: 'center', prawo: 'right' };
const AKAPIT_RE = new RegExp(`&lt;/?(${ZNACZNIKI_AKAPITU.join('|')})&gt;`, 'gi');

const PRZED_AKAPITEM = `(?:\\s|<[^>]*>|&lt;/?(?:${ZNACZNIKI_TEKSTU.join('|')})(?:\\s*=\\s*[^&\\s]*\\s*)?&gt;)*`;

// Znacznik nie na początku wiersza (albo zamknięcie nie na końcu / bez otwarcia) zostaje tekstem.
function wyrownaniaAkapitow(html) {
  const zle = [];

  const linie = html.split('<br>').map((l) => {
    let w = '';
    const m = AKAPIT_POCZ_RE.exec(l);
    if (m) {
      w = WYROWNANIA_AKAPITU[plain(m[2])];
      l = m[1] + l.slice(m[0].length);
      const k = AKAPIT_KON_RE.exec(l);
      if (k && plain(k[1]) === plain(m[2])) l = l.slice(0, k.index) + k[2];
    }
    for (const z of l.match(AKAPIT_RE) || []) zle.push(z.replace(/&lt;/g, '<').replace(/&gt;/g, '>'));

// Dzieli zrównoważony HTML w miejscu idx: znaczniki otwarte w tym miejscu są domykane na końcu

function podzielHtml(html, idx) {
  const a = html.slice(0, idx), stos = [];

    const n = nazwa.toLowerCase();
    if (n === 'img' || n === 'br') continue;

    const i = stos.map((x) => x.n).lastIndexOf(n);
    if (i >= 0) stos.splice(i, 1);

}
const pustyWiersz = (l) => !/<img|ikona-kolor/.test(l) && !l.replace(/<[^>]*>/g, '').trim();

// Zwraca indeks w HTML-u zaraz za punktorem albo -1.
function punktListy(l) {
  let tekst = '';

  for (let i = 0; i < l.length && tekst.length < 40;) {
    if (l[i] === '<') { const k = l.indexOf('>', i); if (k < 0) break; i = k + 1; continue; }
    let n = 1;
    if (l[i] === '&') { const e = l.indexOf(';', i); if (e > i && e - i < 10) n = e - i + 1; }

// Wiersze (<br>) → bloki <div class="akapit">; bez wyrównań i bez wierszy listy HTML zostaje bez zmian.
function naAkapity(html, wyr, lista) {
  const linie = [];
  let reszta = html;
  for (;;) {
    const i = reszta.indexOf('<br>');
    if (i < 0) { linie.push(reszta); break; }
    const [a, b] = podzielHtml(reszta.slice(0, i) + reszta.slice(i + 4), i);
    linie.push(a); reszta = b;
  }
  const punkty = linie.map((l) => (lista ? punktListy(l) : -1));
  if (!wyr.some(Boolean) && !punkty.some((p) => p > 0)) return html;
  if (linie.length > 1 && pustyWiersz(linie[linie.length - 1]) && !wyr[linie.length - 1]) linie.pop();   // \n na końcu – jak <br> na końcu
  return linie.map((l, i) => {
    const st = wyr[i] ? ` style="text-align:${wyr[i]}"` : '';
    if (pustyWiersz(l)) return `<div class="akapit"${st}>${l}<br></div>`;     // pusty wiersz zachowuje wysokość
    if (punkty[i] > 0) {
      const [a, b] = podzielHtml(l, punkty[i]);
      return `<div class="akapit lista"${st}><span class="punkt">${a} </span><span class="wiersz">${b}</span></div>`;

// Liczba z tekstu – przecinek dziesiętny (17,8) jak kropka; przy nieczytelnej wartości NaN.
const liczbaZTekstu = (v) => num(String(v ?? '').trim().replace(/(\d),(\d)/g, '$1.$2'));

function krycieLiczba(v) {
  let s = String(v ?? '').trim();
  if (!s) return null;
  const proc = s.endsWith('%');
  if (proc) s = s.slice(0, -1);

// Odbicie: poziome | pionowe | oba → fragment transform.
const ODBICIA = { poziome: 'scale(-1,1)', pionowe: 'scale(1,-1)', oba: 'scale(-1,-1)' };

function renderCard(tpl, cmds, row, ctx) {

  // formatowanie: false → dane jak zwykły tekst (bez_formatowania, kolory, ścieżki, warunki).

    let had = false, any = false;

    });

  const liczba = (a) => {
    const s = String(a ?? '').trim();

    const v = value(s);

    if (v === undefined) return null;

    if (s === '') return null;
    const k = krycieLiczba(s);
    if (k === null) ctx.warn.add(`${where}: ${ctx.label}: krycie „${s}” to nie liczba (np. krycie=0.5 albo krycie=50%)`);
    return k;
  };

    if (v === undefined) return '';

    if (!ODBICIA[s]) { ctx.warn.add(`${where}: ${ctx.label}: odbicie= poziome, pionowe albo oba`); return ''; }

  const kadrOf = (v, where) => {
    const tok = String(v ?? '').match(/(?:\[[^\[\]]*\]|[^\s\[\]])+/g) || [];
    const cz = tok.flatMap((t) => { const x = value(t); return x === '' ? [''] : x.split(/\s+/); });

      return null;

    const czesci = String(expr ?? '').split('>').map((x) => x.trim()).filter(Boolean);

      const [ln, rn] = [liczbaZTekstu(ls), liczbaZTekstu(rs)];

// Kolumny specjalne (Ilość, ID, Nazwa) – bez względu na wielkość liter i polskie znaki (ilosc, Id…).
function pole(r, nazwa) {
