    const { name, arkusz, zapas, podany } = znajdzDane(talia.dane) || {};
    if (!name) { missing.push(`${talia.nazwa} (${talia.dane[0]})`); continue; }
    if (zapas) warn.add(`${talia.nazwa}: pliku ${podany} nie ma pod ścieżką z DANE – użyto ${name}. Wpisz w DANE pełną ścieżkę (${name}) albo przenieś plik na miejsce.`);
    let rows;
    try { rows = await readTable(files.get(name), arkusz); }
    catch (e) { warn.add(talia.nazwa + ': błąd odczytu ' + name + ' – ' + e.message); continue; }

    RAPORT.talie.push({ nazwa: talia.nazwa, plik: name + (arkusz ? '#' + arkusz : ''), rows });
    const liczba = rows.reduce((s, r) => s + copies(r), 0);
    const dzis = new Date().toLocaleDateString('pl-PL');
    const wspolneWb = { liczba, wersja: WERSJA, talia: talia.nazwa, projekt: PROJEKT, data: dzis };
    // Numer albo kopia na karcie → każdą kopię rysujemy osobno; inaczej jedna kopia powielona.
    const kazdaKopia = /\[\s*_(numer|kopia)\s*\]/i.test(tekstSzablonu);
    const base = { warn, icons, plik: `${talia.plik} (${talia.nazwa})`, formatowanie: RAPORT.formatowanie };
    // Rewers zależny od karty (#47): rysowany dla każdego wiersza (dla każdej kopii przy [_numer]/[_kopia] w [REWERS]),
    // powtórki usuwane po wyglądzie. przyp: 'wiersz' albo 'wiersz|kopia' → numer rewersu w lista.
    const zal = talia.rewers.length && talia.rewersZalezny ? { perKopia: !!talia.rewersPerKopia, przyp: new Map(), wzory: new Map(), lista: [], els: [] } : null;
    let cards = '', n = 0;
    rows.forEach((r, i) => {
      const label = `${talia.nazwa} ${pole(r, 'ID') || i + 1}${pole(r, 'Nazwa') ? ' ' + pole(r, 'Nazwa') : ''}`;
      const k = copies(r);
      if (!k) return;
      const id = pole(r, 'ID') || String(i + 1);
      const karta = (kopia) => {
        const card = renderCard(talia, talia.awers, r, { ...base, label, kolumny: true,
          wbudowane: { ...wspolneWb, numer: n + kopia, kopia, id } });
        return `<div class="karta" style="${esc(card.style)}" data-talia="${esc(talia.nazwa)}" data-id="${esc(id)}" data-row="${i}" title="${esc(label)}">${card.html}</div>`;
      };
      if (kazdaKopia) for (let c = 1; c <= k; c++) cards += karta(c);
      else cards += karta(1).repeat(k);
      if (zal) {
        const rewers = (kopia) => {
          const card = renderCard(talia, talia.rewers, r, { ...base, label: label + ' – rewers', kolumny: true,
            wbudowane: { ...wspolneWb, numer: n + kopia, kopia, id } });
          const klucz = card.style + '\u0000' + card.html;
          if (!zal.wzory.has(klucz)) { zal.wzory.set(klucz, zal.lista.length); zal.lista.push({ card, ile: 0 }); }
          return zal.wzory.get(klucz);
        };
        if (zal.perKopia) for (let c = 1; c <= k; c++) { const nr = rewers(c); zal.przyp.set(i + '|' + c, nr); zal.lista[nr].ile++; }
        else { const nr = rewers(1); zal.przyp.set(String(i), nr); zal.lista[nr].ile += k; }
      }
      n += k;
    });
    total += n;
    found.push(`${talia.nazwa}: ${n}`);
    let back = '';
    if (zal && zal.lista.length) {
      // Każdy różny rewers na początku talii (jak dotąd jeden); numer w data-rewers na opakowaniu – nie na karcie,
      // żeby odcisk rewersu zależał tylko od wyglądu. Przypisanie karta → rewers: REWERSY_KART (bez atrybutów na awersach).
      const label = `${talia.nazwa} – rewers`, wiele = zal.lista.length > 1;
      back = zal.lista.map(({ card, ile }, nr) => `<div class="rewers-podglad" data-rewers="${nr}"><div class="karta rewers" style="${esc(card.style)}" data-talia="${esc(talia.nazwa)}" data-id="rewers" title="${esc(label)}">${card.html}</div>`
        + `<span class="etykieta">${wiele ? `Rewers ${nr + 1} · ×${ile}` : 'Rewers'}</span></div>`).join('');
      noweRewersy.set(talia.nazwa, zal);
    } else if (talia.rewers.length && !zal) {
      const label = `${talia.nazwa} – rewers`;
      const card = renderCard(talia, talia.rewers, {}, { ...base, label, kolumny: false, wbudowane: wspolneWb });
      back = `<div class="rewers-podglad"><div class="karta rewers" style="${esc(card.style)}" data-talia="${esc(talia.nazwa)}" data-id="rewers" title="${esc(label)}">${card.html}</div><span class="etykieta">Rewers</span></div>`;
    }
    html += `<section class="talia" data-talia="${esc(talia.nazwa)}"><h2 class="talia-tytul">${esc(talia.nazwa)} · ${n} kart (${name}, szablon ${esc(talia.plik)})</h2><div class="siatka">${back}${cards}</div></section>`;
  }

  if (missing.length) warn.add('Nie znaleziono plików z kartami: ' + missing.join(', ') + '. Sprawdź komendę DANE w szablonie i czy plik leży w folderze projektu.');
  if (!found.length) {
    status('Żadna talia nie ma pliku z kartami – sprawdź Uwagi.');
    view.innerHTML = '';
    REWERSY_KART = new Map();
  } else {
    view.innerHTML = html;
    for (const s of view.querySelectorAll('.talia')) {
      const zal = noweRewersy.get(s.dataset.talia);
      if (zal) zal.els = [...s.querySelectorAll('.rewers-podglad[data-rewers] > .karta.rewers')];
    }
    REWERSY_KART = noweRewersy;
    oznaczKopie(view);
    await waitForImages(view);
    for (const l of new Set(fitAll(view))) warn.add(l + ': tekst nie mieści się nawet po zmniejszeniu (czerwona ramka)');
    await oznaczZmiany(view);

    const sel = $('filtr'), current = sel.value;
    sel.innerHTML = '<option value="">Wszystkie talie</option>' +
      TALIE.filter((t) => view.querySelector(`[data-talia="${CSS.escape(t.nazwa)}"]`)).map((t) => `<option>${esc(t.nazwa)}</option>`).join('');
    sel.value = [...sel.options].some((o) => o.value === current) ? current : '';
    applyFilter();

    $('start').style.display = 'none';
    ['obrazkiPrzycisk', 'raportPrzycisk', 'historiaPrzycisk'].forEach((id) => $(id).disabled = false);
    status(`${total} kart · ${found.join(' · ')} · odświeżono ${new Date().toLocaleTimeString('pl-PL')}`);
  }
  // Uwagi z numerem wiersza szablonu (i brakujące kolumny) trafiają też do edytora.
  const plikSzablonu = SZABLON.split('/').pop();
  const linie = new Map(), wpisz = (n, t) => { if (!linie.has(n)) linie.set(n, []); if (!linie.get(n).includes(t)) linie.get(n).push(t); };
  const liniaUwagi = (w) => { const m = /^(.+?), wiersz (\d+): /.exec(w); return m && m[1] === plikSzablonu ? +m[2] : 0; };
  for (const w of warn) {
    const n = liniaUwagi(w);
    if (n) wpisz(n, w.replace(/^.+?, wiersz \d+: /, ''));
    const k = /nie ma kolumny \[([^\]]+)\]/.exec(w);
    if (k) tekstSzablonu.split('\n').forEach((l, i) => {
      if (l.toLowerCase().includes('[' + k[1].toLowerCase() + ']')) wpisz(i + 1, `w pliku danych nie ma kolumny [${k[1]}]`);
    });
  }
  edytorBledy(linie);

  const u = $('uwagi');
  u.innerHTML = warn.size ? '<b>Uwagi:</b><ul>' + [...warn].map((w) => {
    const n = liniaUwagi(w);
    return n ? `<li><a href="#" data-linia="${n}">${esc(w)}</a></li>` : '<li>' + esc(w) + '</li>';
  }).join('') + '</ul>' : '';
  for (const a of u.querySelectorAll('[data-linia]')) a.onclick = (e) => { e.preventDefault(); idzDoLinii(+a.dataset.linia); };
  u.classList.toggle('widoczne', warn.size > 0);
  if (!$('raport').hidden) pokazRaport(true);
  window.zbudowano = true;                       // zlecenia z pliku czekają na pierwsze karty
}

// ── Raport projektu ─────────────────────────────────────────────────────────
// Duplikaty ID, puste pola używanych kolumn, nieużywane kolumny, obrazki i ikony.
// Obrazki (OBRAZEK i TŁO z pliku) z rozdzielczością poniżej 300 dpi w rozmiarze, w jakim stoją na karcie.
// Grafiki SVG są wektorowe – pomijane. Wynik: lista „plik – N dpi (talie)”, od najgorszych.
async function obrazkiNiskiejRozdzielczosci(prog = 300) {
  const PX_MM = 96 / 25.4;
  const naj = new Map();                               // plik → { dpi, talie }
  const dodaj = (u, dpi, talia) => {
    const plik = (URL_PLIK.get(u) || '').replace(/@[^@]*$/, '');
    if (!plik || /\.svg$/i.test(plik) || !(dpi > 0)) return;
    const x = naj.get(plik) || naj.set(plik, { dpi: Infinity, talie: new Set() }).get(plik);
    if (dpi < prog) x.talie.add(talia);
    x.dpi = Math.min(x.dpi, dpi);
  };
  const wymiary = new Map();
  const rozmiar = (u) => wymiary.get(u) || wymiary.set(u, new Promise((r) => {
    const i = new Image(); i.onload = () => r([i.naturalWidth, i.naturalHeight]); i.onerror = () => r([0, 0]); i.src = u;
  })).get(u);
  for (const k of $('podglad').querySelectorAll('.karta')) {
    const talia = k.dataset.talia || '';
    for (const img of k.querySelectorAll('.el.obrazek img')) {
      const [nw, nh] = img.naturalWidth ? [img.naturalWidth, img.naturalHeight] : await rozmiar(img.src);
      const box = img.parentElement, bw = box.offsetWidth / PX_MM, bh = box.offsetHeight / PX_MM;   // mm (bez obrotu)
      if (!nw || !nh || !bw || !bh) continue;
      const fit = img.style.objectFit;
      const pow = +((/scale\(([\d.]+)\)/.exec(img.style.transform) || [])[1] || 1);   // kadr= powiększa obraz
      const mmNaPx = fit === 'cover' ? Math.max(bw / nw, bh / nh) : fit === 'fill' ? null : Math.min(bw / nw, bh / nh);
      dodaj(img.src, (mmNaPx === null ? Math.min(nw / bw, nh / bh) * 25.4 : 25.4 / mmNaPx) / pow, talia);
    }
    const m = /url\(["']?(blob:[^"')]+)/.exec(k.style.backgroundImage || '');
    if (m) {
      const [nw, nh] = await rozmiar(m[1]);
      const bw = k.offsetWidth / PX_MM, bh = k.offsetHeight / PX_MM;
      if (nw && nh && bw && bh) dodaj(m[1], 25.4 / Math.max(bw / nw, bh / nh), talia);   // tło: cover
    }
  }
  return [...naj.entries()].filter(([, x]) => x.dpi < prog).sort((a, b) => a[1].dpi - b[1].dpi)
    .map(([p, x]) => `${esc(p)} – <b>${Math.round(x.dpi)} dpi</b> <span class="opis">(${esc([...x.talie].join(', '))})</span>`);
}

// ── Raport – tryb drukarni (#66) ────────────────────────────────────────────
// Trzy sprawdzenia przed wysłaniem PDF do drukarni (panel Raport → „Tryb drukarni”, zlecenie
// raport z drukarnia = tak). Liczone na kartach podglądu po fitAll (rzeczywisty układ tekstu):
// 1. odstęp tekstu i ikon od linii cięcia – z obwiedni glifów (prostokąty linii tekstu z Range,
//    w pionie zawężone do faktycznej wysokości znaków z measureText), próg MARGINES_DRUKARNI;
// 2. „prawie czerń” (jasność L* < 20, ale nie #000) w kolorach tekstu, obrysów, obwódek, linii i ikon SVG –
//    po konwersji do CMYK wychodzi z niej rich black (czterokolorowa), a drukarnie chcą tekstu w K100;
// 3. kolor pasa 0–3 mm wewnątrz linii cięcia (awersy i rewersy, z obrazka karty) – bez podpowiedzi Pantone (decyzja 25.10.2026):
//    fiolet / szarość / brąz bez białej obwódki → słaba powtarzalność, czarny → „border black” C40 K100.
const MARGINES_DRUKARNI = 3;          // mm od linii cięcia (tolerancja cięcia ±1 mm)
const PROG_CZERNI = 20;               // L* (0–100); #000 ma 0, domyślny kolor tekstu #1d1b19 ≈ 10
const DOMYSLNY_KOLOR_TEKSTU = 'rgb(29, 27, 25)';     // .karta { color: #1d1b19 }
let OSTATNI_RAPORT_DRUKARNI = null;
const PASY_KART = new Map();          // odcisk karty → wynik analizy pasa (obrazek karty jest drogi)
const KOLORY_SVG = new Map();         // adres ikony → lista kolorów z pliku SVG

const rgbZCss = (c) => { const m = String(c).match(/rgba?\(([^)]+)\)/); if (!m) return null; const v = m[1].split(/[\s,/]+/).filter(Boolean).map(parseFloat); return [v[0], v[1], v[2], v.length > 3 ? v[3] : 1]; };
const rgbZHex = (h) => { h = h.replace('#', ''); if (h.length <= 4) h = [...h].map((x) => x + x).join(''); return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16)).concat(h.length === 8 ? parseInt(h.slice(6, 8), 16) / 255 : 1); };
const hexZRgb = ([r, g, b]) => '#' + [r, g, b].map((x) => Math.round(x).toString(16).padStart(2, '0')).join('');
function labZRgb([r, g, b]) {
  const lin = (c) => { c /= 255; return c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; };
  const [R, G, B] = [lin(r), lin(g), lin(b)];
  const f = (t) => (t > 216 / 24389 ? Math.cbrt(t) : (24389 / 27 * t + 16) / 116);
  const X = f((0.4124 * R + 0.3576 * G + 0.1805 * B) / 0.95047), Y = f(0.2126 * R + 0.7152 * G + 0.0722 * B), Z = f((0.0193 * R + 0.1192 * G + 0.9505 * B) / 1.08883);
  return [116 * Y - 16, 500 * (X - Y), 200 * (Y - Z)];
}
const prawieCzarny = (rgb) => !!rgb && rgb[3] > 0 && !(rgb[0] === 0 && rgb[1] === 0 && rgb[2] === 0) && labZRgb(rgb)[0] < PROG_CZERNI;
// Numer rewersu zależnego od karty (#47; opakowanie .rewers-podglad[data-rewers]) – '' przy rewersie wspólnym.
const nrRewersu = (k) => (k.parentElement && k.parentElement.dataset.rewers) || '';
const opisKarty = (k) => k.classList.contains('rewers')
  ? `${k.dataset.talia} – rewers` + (nrRewersu(k) && k.closest('.siatka').querySelectorAll('[data-rewers]').length > 1 ? ' ' + (+nrRewersu(k) + 1) : '')
  : (k.title || `${k.dataset.talia} ${k.dataset.id || ''}`).trim();

// Obwiednia glifów elementu (px, układ okna): prostokąty fragmentów tekstu z Range, w pionie
// zawężone do wysokości znaków (measureText – actualBoundingBox), plus ikony (img, .ikona-kolor).
let MIARKA = null;
function obwiedniaGlifow(el) {
  if (!MIARKA) MIARKA = document.createElement('canvas').getContext('2d');
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  const dodaj = (l, t, r, b) => { x1 = Math.min(x1, l); y1 = Math.min(y1, t); x2 = Math.max(x2, r); y2 = Math.max(y2, b); };
  const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT);
  const zakres = document.createRange();
  for (let n = w.nextNode(); n; n = w.nextNode()) {
    if (n.nodeType === 1) {
      if (n.matches('img.ikona, .ikona-kolor')) { const r = n.getBoundingClientRect(); if (r.width && r.height) dodaj(r.left, r.top, r.right, r.bottom); }
      continue;
    }
    const tekst = n.nodeValue;
    if (!tekst.trim()) continue;
    const st = getComputedStyle(n.parentElement);
    MIARKA.font = st.font;
    const m = MIARKA.measureText(tekst.trim());
    const obrys = (parseFloat(st.webkitTextStrokeWidth) || 0) / 2;
    zakres.selectNodeContents(n);
    for (const r of zakres.getClientRects()) {
      if (r.width < 0.5 || r.height < 0.5) continue;
      // Prostokąt fragmentu = obszar treści czcionki (fontBoundingBox); znaki są niższe.
      const linia = r.top + (m.fontBoundingBoxAscent ?? r.height * 0.8) * (r.height / ((m.fontBoundingBoxAscent + m.fontBoundingBoxDescent) || r.height));
      const gora = Number.isFinite(m.actualBoundingBoxAscent) ? linia - m.actualBoundingBoxAscent : r.top;
      const dol = Number.isFinite(m.actualBoundingBoxDescent) ? linia + m.actualBoundingBoxDescent : r.bottom;
      dodaj(r.left - obrys, Math.max(r.top, gora) - obrys, r.right + obrys, Math.min(r.bottom, dol) + obrys);
    }
  }
  return x1 === Infinity ? null : { x1, y1, x2, y2 };
}

// Najmniejszy odstęp tekstu/ikon od krawędzi karty (linii cięcia) – w mm, z kierunkiem.
function odstepyKarty(k) {
  const kr = k.getBoundingClientRect();
  if (!kr.width) return null;
  const pxNaMm = kr.width / cardMm(k)[0];
  let naj = null;
  for (const el of k.querySelectorAll('.el.tekst, .el.ikony')) {
    if (getComputedStyle(el).display === 'none') continue;
    const o = obwiedniaGlifow(el);
    if (!o) continue;
    const strony = [['lewa', o.x1 - kr.left], ['górna', o.y1 - kr.top], ['prawa', kr.right - o.x2], ['dolna', kr.bottom - o.y2]];
    for (const [strona, px] of strony) {
      const mmOd = px / pxNaMm;
      if (!naj || mmOd < naj.odstep) naj = { odstep: mmOd, krawedz: strona, element: el.classList.contains('ikony') ? 'IKONA' : 'TEKST', tekst: el.textContent.trim().replace(/\s+/g, ' ').slice(0, 40) };
    }
  }
  return naj;
}

// Kolory do sprawdzenia „prawie czerni” w karcie: [{ rgb, rodzaj }].
async function koloryKarty(k) {
  const out = [];
  for (const el of k.querySelectorAll('.el')) {
    const st = getComputedStyle(el);
    if (st.display === 'none') continue;
    if (el.classList.contains('tekst') && el.textContent.trim()) {
      const c = rgbZCss(st.color);
      out.push({ rgb: c, rodzaj: st.color === DOMYSLNY_KOLOR_TEKSTU && !el.style.color ? 'tekst (domyślny kolor KarKi #1d1b19)' : 'tekst' });
      if (parseFloat(st.webkitTextStrokeWidth) > 0) out.push({ rgb: rgbZCss(st.webkitTextStrokeColor), rodzaj: 'obrys tekstu' });
    }
    if (parseFloat(st.borderTopWidth) > 0) out.push({ rgb: rgbZCss(st.borderTopColor), rodzaj: 'obwódka' });
    for (const s of el.querySelectorAll('svg [stroke], svg [fill]')) for (const a of ['stroke', 'fill']) {
      const v = s.getAttribute(a);
      if (v && v !== 'none') out.push({ rgb: /^#/.test(v) ? rgbZHex(v) : rgbZCss(v), rodzaj: 'linia' });
    }
    for (const sp of el.querySelectorAll('.ikona-kolor')) { const v = sp.style.getPropertyValue('--k').trim(); if (/^#/.test(v)) out.push({ rgb: rgbZHex(v), rodzaj: 'ikona koloru' }); }
    for (const img of el.querySelectorAll('img.ikona')) for (const c of await koloryIkonySvg(img)) out.push({ rgb: c.rgb, rodzaj: 'ikona ' + c.plik });
  }
  return out;
}
async function koloryIkonySvg(img) {
  const plik = (URL_PLIK.get(img.src) || '').replace(/@.*$/, '');
  if (!/\.svg$/i.test(plik)) return [];
  if (!KOLORY_SVG.has(img.src)) {
    let kolory = [];
    try {
      const t = await (await fetch(img.src)).text();
      const wart = [...t.matchAll(/(?:fill|stroke|stop-color|color)\s*[:=]\s*["']?\s*(#[0-9a-f]{3,8}\b|rgba?\([^)]*\))/gi)].map((m) => m[1]);
      kolory = [...new Set(wart.map((v) => v.toLowerCase()))].map((v) => ({ rgb: v[0] === '#' ? rgbZHex(v) : rgbZCss(v), plik: plik.split('/').pop() }));
    } catch (e) { /* ikona nieczytelna – pomijamy */ }
    KOLORY_SVG.set(img.src, kolory);
  }
  return KOLORY_SVG.get(img.src);
}

// Pas 0–3 mm wewnątrz linii cięcia: obrazek karty (72 dpi), piksele pasa w Lab.
async function pasKarty(k) {
  const klucz = skrot(htmlKarty(k));
  if (PASY_KART.has(klucz)) return PASY_KART.get(klucz);
  let wynik = null;
  try {
    const dpi = 72, blob = await obrazKarty(k, { dpi, format: 'png' });
    const bm = await createImageBitmap(blob);
    const c = document.createElement('canvas'); c.width = bm.width; c.height = bm.height;
    const g = c.getContext('2d'); g.drawImage(bm, 0, 0);
    const { data, width: W, height: H } = g.getImageData(0, 0, c.width, c.height);
    const pas = MARGINES_DRUKARNI * dpi / 25.4, brzeg = 1 * dpi / 25.4;
    const piks = [], zewn = [];
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const d = Math.min(x, y, W - 1 - x, H - 1 - y);
      if (d >= pas) { x = Math.max(x, W - 1 - Math.ceil(pas)); continue; }
      const i = (y * W + x) * 4;
      if (data[i + 3] < 128) continue;                       // zaokrąglone rogi (wycina drukarnia)
      const rgb = [data[i], data[i + 1], data[i + 2]];
      piks.push(rgb); if (d < brzeg) zewn.push(rgb);
    }
    if (piks.length) wynik = ocenPas(piks, zewn);
  } catch (e) { wynik = { blad: String(e.message || e) }; }
  PASY_KART.set(klucz, wynik);
  return wynik;
}
function ocenPas(piks, zewn) {
  const bialy = (rgb) => { const [L, a, b] = labZRgb(rgb); return L > 92 && Math.hypot(a, b) < 8; };
  if (zewn.length && zewn.filter(bialy).length / zewn.length >= 0.9) return { rodzaj: 'biała obwódka' };
  const lab = piks.map(labZRgb);
  const med = [0, 1, 2].map((i) => { const v = lab.map((x) => x[i]).sort((p, q) => p - q); return v[v.length >> 1]; });
  const blisko = lab.filter((x) => Math.hypot(x[0] - med[0], x[1] - med[1], x[2] - med[2]) < 10).length / lab.length;
  // Kolor dominujący jako RGB (średnia pikseli bliskich medianie).
  const bl = piks.filter((_, i) => Math.hypot(lab[i][0] - med[0], lab[i][1] - med[1], lab[i][2] - med[2]) < 10);
  const sr = [0, 1, 2].map((i) => bl.reduce((s, p) => s + p[i], 0) / (bl.length || 1));
  const kolor = hexZRgb(sr), [r, g, b] = sr.map((v) => v / 255);
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), s = mx ? (mx - mn) / mx : 0;
  let h = 0;
  if (mx !== mn) h = (mx === r ? (g - b) / (mx - mn) : mx === g ? 2 + (b - r) / (mx - mn) : 4 + (r - g) / (mx - mn)) * 60;
  if (h < 0) h += 360;
  const jednolity = blisko >= 0.9, wspolny = blisko >= 0.6;
  if (med[0] > 92 && Math.hypot(med[1], med[2]) < 8) return { rodzaj: 'biały', kolor };
  if (med[0] < 20 && Math.hypot(med[1], med[2]) < 15) return { rodzaj: jednolity ? 'czarny' : 'mieszany', kolor, udzial: blisko };
  const odcien = s > 0.15 && h >= 255 && h <= 335 ? 'fiolet' : s < 0.1 && mx > 0.15 && mx < 0.9 ? 'szarość' : s > 0.2 && h >= 10 && h <= 50 && mx < 0.6 ? 'brąz' : '';
  if (odcien && wspolny) return { rodzaj: 'ryzykowny', odcien, kolor, udzial: blisko };
  return { rodzaj: jednolity ? 'jednolity' : 'mieszany', kolor, udzial: blisko };
}

// Wynik: { margines, odstep: [{ karta, talia, strona, odstep, krawedz, element, tekst }], czern: [...], krawedz: [...], spad: [{ karta, talia, strona, plik, brak }] }
// Obrazki wypełnij / rozciągnij dotykające krawędzi karty, których obraz nie sięga do końca spadu
// (#74): w układzie Drukarnia ramka rośnie o spad, a obraz zostaje w miejscu – w spadzie wychodzi tło.
// Liczone z rozmiaru naturalnego (cover: skala = max(szer/nat_szer, wys/nat_wys), wystaje w osi, w której
// obraz jest większy od ramki, wg object-position; rozciągnij: nie wystaje wcale). kadr= i obrócone – pomijane.
function obrazkiBezSpadu(k, spad = SPAD_DRUKARNI) {
  const [w, h] = cardMm(k), wynik = [];
  if (spadTalii(k.dataset.talia)) return wynik;                    // spad z szablonu – sprawdza plikiZeSpadem
  for (const el of k.querySelectorAll(':scope > .el.obrazek')) {
    const img = el.querySelector('img');
    if (!img || !/cover|fill/.test(img.style.objectFit) || /translate/.test(img.style.transform)) continue;
    const g = krawedzieSpadu(el, w, h);
    if (!g) continue;
    const p = obrazWRamce(img, img.naturalWidth, img.naturalHeight, g.ew, g.eh);
    if (img.style.objectFit === 'cover' && !p.wystaje) continue;      // rozmiaru nie znamy – nie zgadujemy
    const wystaje = { lewo: -p.ox, prawo: p.ox + p.iw - g.ew, gora: -p.oy, dol: p.oy + p.ih - g.eh };
    const brak = ['lewo', 'prawo', 'gora', 'dol'].filter((b) => g[b] && wystaje[b] < spad - 0.01)
      .map((b) => ({ krawedz: { lewo: 'lewa', prawo: 'prawa', gora: 'górna', dol: 'dolna' }[b], wystaje: Math.round(Math.max(0, wystaje[b]) * 100) / 100 }));
    if (brak.length) wynik.push({ plik: (URL_PLIK.get(img.src) || '').replace(/@[^@]*$/, ''), brak });
  }
  return wynik;
}

// Spad z szablonu (#84): TŁO z pliku i obrazki przy krawędzi mają ramkę karty ze spadem – plik powinien mieć jej
// proporcje. Inne proporcje: cover przycina obraz (plik bez spadu – proporcje samej karty – traci spad z obrazu,
// a powiększenie przesuwa rysunek), rozciągnij go zniekształca. Tolerancja 1 %.
function plikiZeSpadem(k) {
  const sp = spadTalii(k.dataset.talia), wynik = [];
  if (!sp) return wynik;
  const [w, h] = cardMm(k);
  for (const el of k.querySelectorAll(':scope > .el.obrazek')) {
    const img = el.querySelector('img'), x = parseFloat(el.style.left), y = parseFloat(el.style.top);
    const fw = parseFloat(el.style.width), fh = parseFloat(el.style.height);
    if (!img || !img.naturalWidth || !img.naturalHeight || !/cover|fill/.test(img.style.objectFit) || /translate/.test(img.style.transform)) continue;
    if (!(x < -0.01 || y < -0.01 || x + fw > w + 0.01 || y + fh > h + 0.01)) continue;   // nie sięga spadu
    const r = (img.naturalWidth / img.naturalHeight) / (fw / fh);
    if (Math.abs(r - 1) <= 0.01) continue;
    // Ramka bez spadu (część w obrębie karty) – proporcje pliku bez spadu.
    const bw = Math.min(w, x + fw) - Math.max(0, x), bh = Math.min(h, y + fh) - Math.max(0, y);
    const bezSpadu = Math.abs((img.naturalWidth / img.naturalHeight) / (bw / bh) - 1) <= 0.01;
    wynik.push({ plik: (URL_PLIK.get(img.src) || '').replace(/@[^@]*$/, ''), tlo: el.classList.contains('tlo'), ramka: [fw, fh].map((v) => Math.round(v * 100) / 100),
      obraz: [img.naturalWidth, img.naturalHeight], dopasowanie: img.style.objectFit === 'fill' ? 'rozciągnij' : 'wypełnij', bezSpadu });
  }
  return wynik;
}

async function raportDrukarni() {
  const praca = async () => {
    const filtr = $('filtr').value; $('filtr').value = ''; applyFilter();      // odfiltrowane talie też
    try {
      const karty = [...$('podglad').querySelectorAll('.talia .karta')];
      const odstep = [], czern = new Map(), pasy = new Map(), spad = [], pliki = [], widziane = new Set();
      for (const k of karty) {
        const rewers = k.classList.contains('rewers');
        const klucz = k.dataset.talia + '|' + (rewers ? 'rewers' + nrRewersu(k) : k.dataset.row);
        const pierwsza = !widziane.has(klucz); widziane.add(klucz);
        const o = odstepyKarty(k);
        if (o && o.odstep < MARGINES_DRUKARNI - 0.005) {
          const byla = odstep.find((x) => x.klucz === klucz);
          if (!byla) odstep.push({ klucz, karta: opisKarty(k), talia: k.dataset.talia, strona: rewers ? 'rewers' : 'awers', ...o, odstep: Math.round(o.odstep * 100) / 100 });
          else if (o.odstep < byla.odstep) Object.assign(byla, o, { odstep: Math.round(o.odstep * 100) / 100 });
        }
        if (!pierwsza) continue;                                   // kopie tej samej karty – raz
        for (const { rgb, rodzaj } of await koloryKarty(k)) {
          if (!prawieCzarny(rgb)) continue;
          const kolor = hexZRgb(rgb), kk = kolor + '|' + rodzaj;
          const x = czern.get(kk) || { kolor, rodzaj, jasnosc: Math.round(labZRgb(rgb)[0]), karty: [] };
          if (!x.karty.includes(opisKarty(k))) x.karty.push(opisKarty(k));
          czern.set(kk, x);
        }
        for (const x of obrazkiBezSpadu(k)) spad.push({ karta: opisKarty(k), talia: k.dataset.talia, strona: rewers ? 'rewers' : 'awers', ...x });
        for (const x of plikiZeSpadem(k)) pliki.push({ karta: opisKarty(k), talia: k.dataset.talia, strona: rewers ? 'rewers' : 'awers', ...x });
        const p = await pasKarty(k);
        if (p && !p.blad && ['czarny', 'ryzykowny'].includes(p.rodzaj)) {
          const kk = k.dataset.talia + '|' + (rewers ? 'r' : 'a') + '|' + p.rodzaj + '|' + (p.odcien || '') + '|' + p.kolor;
          const x = pasy.get(kk) || { talia: k.dataset.talia, strona: rewers ? 'rewers' : 'awers', rodzaj: p.rodzaj, odcien: p.odcien, kolor: p.kolor, karty: [] };
          x.karty.push(opisKarty(k)); pasy.set(kk, x);
        }
      }
      odstep.sort((a, b) => a.odstep - b.odstep);
      odstep.forEach((x) => delete x.klucz);
      // Spad w szablonie (#84): talie bez deklaracji i pliki o proporcjach innych niż karta ze spadem.
      const talie = [...$('podglad').querySelectorAll('.talia')].map((t) => t.dataset.talia);
      const spadSzablonu = { talie: Object.fromEntries(talie.map((t) => [t, spadTalii(t)])), bez: talie.filter((t) => !spadTalii(t)), pliki };
      return { margines: MARGINES_DRUKARNI, odstep, czern: [...czern.values()], krawedz: [...pasy.values()], spad, spadSzablonu };
    } finally { $('filtr').value = filtr; applyFilter(); }
  };
  // Obrazki kart (html-to-image) czytają podgląd – na wyłączność, chyba że eksport już trwa.
  return (OSTATNI_RAPORT_DRUKARNI = EKSPORT_TRWA ? await praca() : await naWylacznosc(praca));
}

// Sekcje raportu dla trybu drukarni (ten sam kształt h3 + ul/div.ok – raportJson je odczyta).
async function sekcjeDrukarni(lista) {
  const r = await raportDrukarni();
  const mm = (v) => String(v.toFixed(1)).replace('.', ',') + ' mm';
  const ileKart = (a) => a.length > 6 ? a.slice(0, 6).map(esc).join(', ') + ` … (+${a.length - 6})` : a.map(esc).join(', ');
  const POKAZ = 25;
  // Spad deklaruje szablon (#84) – w fazie druku w drukarni każda talia potrzebuje spad= i plików ze spadem.
  const ss = r.spadSzablonu, wsz = ss.bez.length === Object.keys(ss.talie).length;
  lista('Drukarnia: spad w szablonie', (ss.bez.length ? [(wsz ? 'Projekt nie deklaruje spadu' : `Talie bez spadu: ${ileKart(ss.bez)}`)
    + ` – w PDF dla drukarni spad jest dorabiany (tło powiększone, obrazki przy krawędzi przedłużone). Do druku w drukarni dopisz spad w szablonie (np. <code>KARTA = 63, 88, spad=3</code>) i przygotuj tło i obrazki przy krawędzi ze spadem`] : [])
    .concat(ss.pliki.slice(0, POKAZ).map((x) => `${esc(x.karta)}: ${esc(x.plik)}${x.tlo ? ' (tło)' : ''} – ${x.obraz[0]}×${x.obraz[1]} px, a ramka ze spadem ma ${mm(x.ramka[0])} × ${mm(x.ramka[1])}`
      + (x.bezSpadu ? ': plik ma proporcje karty bez spadu – przygotuj go ze spadem' : ': inne proporcje') + (x.dopasowanie === 'rozciągnij' ? ' (obraz zostanie zniekształcony)' : ' (część obrazu zostanie przycięta)')))
    .concat(ss.pliki.length > POKAZ ? [`… i ${ss.pliki.length - POKAZ} plików więcej (pełna lista w zleceniu raport z drukarnia = tak)`] : []),
    'wszystkie talie deklarują spad, a tło i obrazki przy krawędzi mają proporcje karty ze spadem');
  lista(`Drukarnia: tekst bliżej niż ${MARGINES_DRUKARNI} mm od linii cięcia`, r.odstep.slice(0, POKAZ).map((x) =>
    `<b>${mm(x.odstep)}</b> – ${esc(x.karta)}: ${x.element === 'IKONA' ? 'ikona' : '„' + esc(x.tekst) + '”'}, ${x.krawedz} krawędź`)
    .concat(r.odstep.length > POKAZ ? [`… i ${r.odstep.length - POKAZ} kart więcej (pełna lista w zleceniu raport z drukarnia = tak)`] : []),
    `tekst i ikony są co najmniej ${MARGINES_DRUKARNI} mm od linii cięcia`);
  lista('Drukarnia: „prawie czerń” zamiast #000', r.czern.map((x) =>
    `<b>${esc(x.kolor)}</b> (jasność ${x.jasnosc}) – ${esc(x.rodzaj)}: ${ileKart(x.karty)}. Po konwersji do CMYK wyjdzie czerń czterokolorowa – drukarnie chcą tekstu i małych ikon w czystej czerni (K100): wpisz #000`),
    'czarne teksty, obrysy i ikony są w #000');
  // Nadruk czerni K100 (#92) – ustawienie z okna Druk i PDF (dotyczy PDF CMYK; zlecenie pdf: klucz nadrukczerni).
  const ud = USTAWIENIA_OKIEN.druk || {};
  r.nadrukCzerni = ud.nadrukCzerni !== false;
  lista('Drukarnia: nadruk czarnego tekstu (K100)', r.nadrukCzerni ? [] : ['Nadruk czerni wyłączony – w PDF CMYK czarny tekst #000 wycina tło do bieli papieru (na kolorowym tle litery wyjdą jaśniejsze, a przy niedopasowaniu pasowania wokół liter pokaże się biały papier). Włącz „Nadruk czarnego tekstu” w oknie Druk i PDF albo poproś drukarnię o nadruk czerni w RIP-ie'],
    'włączony – w PDF CMYK czarny tekst #000 (K100) jest nadrukowany na tło (prostokąty, linie i obrazki – bez nadruku)');
  const RADA = {
    czarny: 'czarna ramka – drukarnia zaleca „border black” C40 M0 Y0 K100',
    ryzykowny: 'słaba powtarzalność między arkuszami – rozważ białą obwódkę',
  };
  lista('Drukarnia: kolor przy krawędzi karty (pas 0–3 mm)', r.krawedz.map((x) =>
    `${esc(x.talia)} – ${x.strona === 'rewers' ? 'rewers' : 'awersy (' + x.karty.length + ')'}: <b>${esc(x.kolor)}</b>${x.odcien ? ' (' + x.odcien + ')' : ''} – ${RADA[x.rodzaj]}` + (x.strona === 'awers' ? `: ${ileKart(x.karty)}` : '')),
    'przy krawędziach nie ma czarnej ramki ani trudnych kolorów');
  lista('Drukarnia: obrazek przy krawędzi nie sięga do końca spadu', r.spad.slice(0, POKAZ).map((x) =>
    `${esc(x.karta)}: ${esc(x.plik)} – ${x.brak.map((b) => `${b.krawedz} krawędź (obraz wystaje ${mm(b.wystaje)} z ${SPAD_DRUKARNI} mm spadu)`).join(', ')}. W spadzie tło pod obrazkiem – obraz nie wystaje poza ramkę`)
    .concat(r.spad.length > POKAZ ? [`… i ${r.spad.length - POKAZ} kart więcej (pełna lista w zleceniu raport z drukarnia = tak)`] : []),
    'obrazki przy krawędziach wypełniają spad');
}

// o.drukarnia (albo przełącznik „Tryb drukarni” w panelu) – dodatkowe sekcje dla drukarni na początku.
async function raportProjektu(o = {}) {
  const sekcje = [];
  const lista = (tyt, el, pusto) => sekcje.push(`<h3>${esc(tyt)}</h3>` + (el.length
    ? '<ul>' + el.map((x) => '<li>' + x + '</li>').join('') + '</ul>' : `<div class="ok">✓ ${esc(pusto)}</div>`));
  if (o.drukarnia ?? raportDrukarniWlaczony()) await sekcjeDrukarni(lista);
  const tekst = RAPORT.tekst, tl = tekst.toLowerCase();
  const uzytaKolumna = (k) => tl.includes('[' + k.trim().toLowerCase() + ']');
  const SPECJALNE = ['ilosc', 'id', 'nazwa'];
  const skrot = (a) => a.slice(0, 12).join(', ') + (a.length > 12 ? ` … (+${a.length - 12})` : '');
  let wszystkieWartosci = tekst;
  const plikiZDanych = new Set();

  for (const { nazwa, plik, rows } of RAPORT.talie) {
    const el = [];
    const aktywne = rows.map((r, i) => ({ r, i })).filter(({ r }) => copies(r) > 0);
    const kopie = aktywne.reduce((s, { r }) => s + copies(r), 0);
    const pominiete = rows.length - aktywne.length;
    el.push(`${aktywne.length} kart (${kopie} z kopiami) w pliku ${esc(plik)}` + (pominiete ? `, ${pominiete} pominiętych (Ilość = 0)` : ''));
    const idKarty = ({ r, i }) => pole(r, 'ID') || 'wiersz ' + (i + 2);
    // Duplikaty ID
    const ile = {};
    for (const x of aktywne) { const id = pole(x.r, 'ID'); if (id) ile[id] = (ile[id] || 0) + 1; }
    const dup = Object.entries(ile).filter(([, n]) => n > 1).map(([id, n]) => `${id} (×${n})`);
    if (dup.length) el.push(`<b>Powtórzone ID:</b> ${esc(skrot(dup))}`);
    // Kolumny
    const kolumny = rows.length ? Object.keys(rows[0]).filter((k) => k) : [];
    const nieuzywane = kolumny.filter((k) => !SPECJALNE.includes(plain(k).toLowerCase()) && !uzytaKolumna(k));
    if (nieuzywane.length) el.push(`<b>Kolumny nieużywane w szablonie:</b> ${esc(nieuzywane.join(', '))}`);
    for (const k of kolumny.filter(uzytaKolumna)) {
      const puste = aktywne.filter(({ r }) => !String(r[k] ?? '').trim()).map(idKarty);
      if (puste.length && puste.length < aktywne.length) el.push(`Kolumna <b>${esc(k)}</b> pusta w ${puste.length} kartach: ${esc(skrot(puste))}`);
      else if (puste.length) el.push(`Kolumna <b>${esc(k)}</b> pusta we wszystkich kartach`);
    }
    for (const { r } of aktywne) for (const v of Object.values(r)) {
      wszystkieWartosci += '\n' + v;
      if (PLIK_RE.test(v)) plikiZDanych.add(norm(v));
    }
    lista(`Talia ${nazwa}`, el, '');
  }

  // Formatowanie z danych (**…**, ~~…~~, <b>…) – od 0.5.5 działa; lista do sprawdzenia wyglądu.
  const fmt = [...RAPORT.formatowanie];
  lista('Formatowanie z danych', fmt.length ? [esc(skrot(fmt))] : [], 'dane nie zawierają formatowania (**…**, ~~…~~, <b>, <i>, <u>, <s>…)');

  // Rozdzielczość obrazków w rozmiarze na karcie (drukarnie chcą min. 300 dpi).
  lista('Obrazki poniżej 300 dpi', await obrazkiNiskiejRozdzielczosci(), 'obrazki mają co najmniej 300 dpi w rozmiarze na karcie');

  // Ikony: znaczniki {x} użyte w szablonie i danych
  const uzyteZnaczniki = new Set([...wszystkieWartosci.matchAll(/\{([^{}]+)\}/g)].flatMap((m) => [iconKey(m[1]), plain(iconKey(m[1]))]));
  const ikonyNieuzywane = [], plikiIkonUzyte = new Set();
  const widziane = new Set();
  for (const [k, v] of Object.entries(RAPORT.icons)) {
    if (widziane.has(v)) continue; widziane.add(v);
    const klucze = Object.entries(RAPORT.icons).filter(([, x]) => x === v).map(([kk]) => kk);
    if (klucze.some((kk) => uzyteZnaczniki.has(kk) || uzyteZnaczniki.has(plain(kk)))) { if (v.plik) plikiIkonUzyte.add(norm(v.plik)); }
    else if (v.plik || v.znak) ikonyNieuzywane.push([k, v.plik ? norm(v.plik) : '']);
  }

  // Obrazki w folderach, do których odwołuje się projekt (i Ikony/), ale których nic nie używa.
  const t = parseTemplate(tekst, SZABLON.split('/').pop());
  const uzyte = new Set([...plikiZDanych, ...plikiIkonUzyte, ...t.pliki.map(norm)]);
  for (const m of tekst.matchAll(/[^\s",=]+\.(png|jpe?g|gif|webp|svg)/gi)) uzyte.add(norm(m[0]));
  const foldery = new Set(FOLDERY_IKON);
  for (const u of [...plikiZDanych, ...t.pliki.map(norm)]) if (u.includes('/') && OBRAZ_RE.test(u)) foldery.add(u.slice(0, u.lastIndexOf('/')));
  // Ikona jest nieużywana, gdy nie ma jej znacznika i jej pliku nie używa nic innego (inny znacznik, dane).
  const ikonyBez = ikonyNieuzywane.filter(([, f]) => !f || !uzyte.has(f));
  lista('Ikony nieużywane', ikonyBez.map(([k]) => `{${esc(k)}}`), 'wszystkie ikony są używane');
  ikonyBez.forEach(([, f]) => f && uzyte.add(f));           // nie powtarzamy ich w obrazkach
  const nieuzyteObrazki = [];
  for (const dir of foldery) for (const n of await spisFolderu(dir))
    if (OBRAZ_RE.test(n) && !uzyte.has(norm(dir + '/' + n))) nieuzyteObrazki.push(esc(dir + '/' + n));
  lista('Obrazki nieużywane', nieuzyteObrazki, 'w folderach projektu nie ma nieużywanych obrazków');
  return sekcje.join('');
}
// Przełącznik „Tryb drukarni” w panelu Raport – zapamiętany w przeglądarce (dla wszystkich projektów).
function raportDrukarniWlaczony() { try { return localStorage.getItem('raportDrukarnia') === '1'; } catch (e) { return false; } }
let RAPORT_NR = 0;
async function pokazRaport(pokaz = $('raport').hidden) {
  const r = $('raport');
  r.hidden = !pokaz;
  if (!pokaz) return;
  const nr = ++RAPORT_NR;                         // przy szybkich przebudowach wygrywa ostatni raport
  const druk = raportDrukarniWlaczony();
  const tresc = await raportProjektu();
  if (nr !== RAPORT_NR) return;

// Różnice linii (LCS); kontekst 2 linie.
function roznice(a, b) {
  if (a.length * b.length > 4e6) return '<span class="kon">(plik za duży do porównania linia po linii)</span>';
  const n = a.length, m = b.length, L = Array.from({ length: n + 1 }, () => new Uint32Array(m + 1));

  const ops = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { ops.push([' ', a[i]]); i++; j++; }
    else if (j < m && (i >= n || L[i][j + 1] >= L[i + 1][j])) { ops.push(['+', b[j]]); j++; }
    else { ops.push(['-', a[i]]); i++; }
  }
  const pokaz = ops.map((o, k) => o[0] !== ' ' || ops.slice(Math.max(0, k - 2), k + 3).some((x) => x[0] !== ' '));
  let html = '', przerwa = false;
  ops.forEach((o, k) => {
    if (!pokaz[k]) { if (!przerwa && html) html += '<span class="kon">…</span>'; przerwa = true; return; }
    przerwa = false;
    html += `<span class="${o[0] === '+' ? 'dod' : o[0] === '-' ? 'usu' : 'kon'}">${o[0]} ${esc(o[1])}</span>`;
  });
  return html || '<span class="kon">bez różnic</span>';
}

const mm = (v) => v + 'mm';

    arkusze: { awersy: arkuszeAwersow, rewersy: arkuszeRewersow } });
}

// ── Eksport JPG ──────────────────────────────────────────────────────────────

// Obrazek karty: JPG – na białym tle (zaokrąglone rogi nie robią się czarne); PNG – z przezroczystymi rogami.
// Czcionki do obrazków kart (html-to-image rysuje kartę w SVG i potrzebuje czcionek osadzonych jako data:).
// Samo html-to-image nie umie ich pobrać: arkusz Google Fonts jest przekierowany na kopię w aplikacji
// (inny adres – przeglądarka nie pozwala czytać jego reguł), więc obrazki wychodziły czcionką zastępczą.
// Zbieramy CSS sami: czcionki wbudowane (/.app/fonts), CZCIONKA_PLIK (blob:) i CZCIONKA_GOOGLE (z internetu, latin/latin-ext).
let CSS_CZCIONEK = null;
async function cssCzcionek() {
  const linki = [...document.querySelectorAll('link[rel=stylesheet][href^="https://fonts.googleapis.com"]')].map((l) => l.href);
  const klucz = $('czcionki-szablonow').textContent + '|' + linki.join('|');
  if (CSS_CZCIONEK && CSS_CZCIONEK.klucz === klucz) return CSS_CZCIONEK.css;
  const naData = async (u) => {
    const r = await fetch(u); if (!r.ok) throw new Error(u);
    const b = await r.blob();
    return new Promise((ok, zle) => { const f = new FileReader(); f.onload = () => ok(f.result); f.onerror = zle; f.readAsDataURL(b); });
  };
  const osadz = async (css, baza) => {
    // Tylko alfabet łaciński (Google dzieli czcionkę na zakresy: cyrylica, grecki… – tych nie pobieramy).
    css = css.replace(/\/\*\s*([\w-]+)\s*\*\/\s*@font-face\s*\{[^}]*\}/g, (m, zakres) => /^(cyrillic|greek|vietnamese|hebrew|arabic|devanagari|math|symbols|emoji)/.test(zakres) ? '' : m);
    for (const u of new Set([...css.matchAll(/url\((['"]?)([^'")]+)\1\)/g)].map((m) => m[2]))) {
      if (u.startsWith('data:')) continue;
      try { css = css.split(u).join(await naData(new URL(u, baza).href)); } catch (e) { /* bez tej czcionki */ }
    }
    return css;
  };
  const czesci = [];
  try {
    const adres = new URL('/.app/fonts/fonts.css', location.href).href;
    const r = await fetch(adres);
    if (r.ok) czesci.push(await osadz(await r.text(), adres));
  } catch (e) { /* poza aplikacją – bez czcionek wbudowanych */ }
  czesci.push(await osadz($('czcionki-szablonow').textContent, location.href));
  for (const href of linki) {
    if (/EB\+Garamond/.test(href) && /Patrick\+Hand/.test(href)) continue;       // to są czcionki wbudowane
    try { const r = await fetch(href); if (r.ok) czesci.push(await osadz(await r.text(), href)); } catch (e) { /* brak internetu */ }
  }
  CSS_CZCIONEK = { klucz, css: czesci.join('\n') };
  return CSS_CZCIONEK.css;
}

async function obrazKarty(el, { dpi = CONFIG.jpgDpi, format = 'jpg' } = {}) {
  if (!window.htmlToImage) await loadScript('https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js');
  const opts = { pixelRatio: dpi / 96, fontEmbedCSS: await cssCzcionek(),
    style: { boxShadow: 'none', outline: 'none', borderRadius: el.style.borderRadius || '0', margin: '0' } };
  let c;
  try { c = await htmlToImage.toCanvas(el, opts); } catch (e) { c = await htmlToImage.toCanvas(el, { ...opts, skipFonts: true }); }
  if (format === 'png') return new Promise((ok) => c.toBlob(ok, 'image/png'));
  const out = document.createElement('canvas');
  out.width = c.width; out.height = c.height;
  const g = out.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, out.width, out.height);
  g.drawImage(c, 0, 0);
  return new Promise((ok) => out.toBlob(ok, 'image/jpeg', CONFIG.jpgJakosc));
}

// Każda karta jako osobny obrazek w folderze Export projektu (zapisuje aplikacja).
// o: { dpi: 150 | 300, format: 'jpg' | 'png', ktore, pominTalie, rewersy }
async function eksportObrazkow(o = {}) {
  const dpi = +o.dpi || CONFIG.jpgDpi, format = o.format === 'png' ? 'png' : 'jpg', FMT = format.toUpperCase();
  const karty = kartyEksportu(o);
  if (!karty.length) { status('Eksport obrazków: brak kart – sprawdź wybór kart i talii.'); return; }
  return naWylacznosc(async () => {
    try {
      const folder = await APP.eksportStart();
      if (!folder) { status('Eksport obrazków anulowany.'); return; }
      const talie = new Set(karty.map((k) => k.dataset.talia));
      const rewersy = o.rewersy === false ? [] : [...$('podglad').querySelectorAll('.siatka .karta.rewers')].filter((k) => talie.has(k.dataset.talia));
      const els = karty.concat(rewersy), nazwy = [];
      // NazwaProjektu_NazwaTalii_NumerKarty_NumerKopii.jpg, rewers: NazwaProjektu_NazwaTalii_rewers.jpg
      const bezZnakow = (t) => String(t).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ł/g, 'l').replace(/Ł/g, 'L');
      const slowo = (t) => bezZnakow(t).split(/[^A-Za-z0-9]+/).filter(Boolean).map((w) => w[0].toUpperCase() + w.slice(1)).join('') || 'X';
      const numer = (t) => bezZnakow(t).replace(/[^\w-]+/g, '_').replace(/^_+|_+$/g, '') || 'X';
      for (let i = 0; i < els.length; i++) {
        status(`Eksport ${FMT}: ${i + 1}/${els.length}…`);
        const el = els[i];
        const przed = slowo(PROJEKT) + '_' + slowo(el.dataset.talia) + '_';
        // Rewersy zależne od karty (#47): tymczasowo rewers, rewers_2… (nazwy z ID karty – następny PR, decyzja 3).
        const name = przed + (el.classList.contains('rewers') ? 'rewers' + (+nrRewersu(el) > 0 ? '_' + (+nrRewersu(el) + 1) : '') : numer(el.dataset.id) + '_' + (el.dataset.kopia || 1)) + '.' + format;
        const blob = await obrazKarty(el, { dpi, format });
        await APP.eksportPlik(name, new Uint8Array(await blob.arrayBuffer()));
        nazwy.push(name);
      }
      status(`Zapisano ${els.length} plików ${FMT} (${dpi} dpi) w ${folder}`);
      punktHistorii(`eksport ${FMT} ${dpi} dpi` + (o.zlecenie ? ' (zlecenie)' : ''));
      if (!o.zlecenie) APP.eksportKoniec();                 // zlecenie z pliku – bez otwierania Findera
      return { folder, pliki: els.length, nazwy };
    } catch (e) {
      status('Eksport obrazków nie powiódł się: ' + ((e && e.message) || e));
      if (o.zlecenie) throw e;
    }
  });
}
window.eksportObrazkow = eksportObrazkow;
async function jpegBlob(el) { return obrazKarty(el); }   // tryb testowy (podgląd JPG)

// ── Katalog talii ────────────────────────────────────────────────────────────
// JPG na talię: najpierw rewers, potem siatka zmniejszonych awersów (każda karta raz, z liczbą kopii) z podpisami „ID Nazwa ×kopie”.
// Strona ma najwyżej ok. 2000×2000 px – większe talie dzielą się na kilka plików (_1, _2…).
// Czytelne dla człowieka i dla modelu językowego (pkt 30 kolejki). Karty za długie mają czerwoną ramkę.
const KATALOG = { dpi: 110, maks: 2000, odstep: 24, podpis: 40, naglowek: 64, margines: 32 };
const bezPolskich = (t) => String(t).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ł/g, 'l').replace(/Ł/g, 'L');
const slowoPliku = (t) => bezPolskich(t).split(/[^A-Za-z0-9]+/).filter(Boolean).map((w) => w[0].toUpperCase() + w.slice(1)).join('') || 'X';

// o: { talie: [nazwy] (puste = wszystkie), id: [ID] (puste = wszystkie), pominTalie }.
// Zwraca [{ nazwa, blob, talia, karty, zaDlugie }] – bez zapisu.
async function katalogPng(o = {}) {
  const tylkoTalie = new Set((o.talie || []).map(plain)), tylkoId = new Set((o.id || []).map((x) => plain(String(x))));
  const pomin = new Set(o.pominTalie || []);
  const wynik = [];
  const filtr = $('filtr').value; $('filtr').value = ''; applyFilter();      // odfiltrowane talie też
  try {
    for (const section of $('podglad').querySelectorAll('.talia')) {
      const talia = section.dataset.talia;
      if (pomin.has(talia) || (tylkoTalie.size && !tylkoTalie.has(plain(talia)))) continue;
      const wiersze = new Map();                                 // wiersz danych → { karta, kopie }
      for (const k of section.querySelectorAll('.karta:not(.rewers)')) {
        if (tylkoId.size && !tylkoId.has(plain(k.dataset.id || ''))) continue;
        const w = wiersze.get(k.dataset.row);
        if (w) w.kopie++; else wiersze.set(k.dataset.row, { karta: k, kopie: 1 });
      }
      const lista = [...wiersze.values()];
      if (!lista.length) continue;
      const rewers = section.querySelector('.karta.rewers');
      if (rewers && !tylkoId.size) lista.unshift({ karta: rewers, kopie: 1, rewers: true });   // rewers na początku
      // Rozmiar miniatury i siatka strony.
      const [wmm, hmm] = cardMm(lista[0].karta);
      const tw = Math.round(wmm / 25.4 * KATALOG.dpi), th = Math.round(hmm / 25.4 * KATALOG.dpi);
      const kom = tw + KATALOG.odstep, rz = th + KATALOG.podpis + KATALOG.odstep;
      const kol = Math.max(1, Math.floor((KATALOG.maks - 2 * KATALOG.margines + KATALOG.odstep) / kom));
      const wierszy = Math.max(1, Math.floor((KATALOG.maks - 2 * KATALOG.margines - KATALOG.naglowek + KATALOG.odstep) / rz));
      const naStrone = kol * wierszy, stron = Math.ceil(lista.length / naStrone);
      const zaDlugie = lista.filter((x) => !x.rewers && x.karta.classList.contains('za-dlugi')).map((x) => x.karta.dataset.id);
      const awersy = lista.filter((x) => !x.rewers);
      for (let s = 0; s < stron; s++) {
        const czesc = lista.slice(s * naStrone, (s + 1) * naStrone);
        const k = Math.min(kol, czesc.length), r = Math.ceil(czesc.length / kol);
        const c = document.createElement('canvas');
        c.width = 2 * KATALOG.margines + k * kom - KATALOG.odstep;
        c.height = 2 * KATALOG.margines + KATALOG.naglowek + r * rz - KATALOG.odstep;
        const g = c.getContext('2d');
        g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height);
        const SANS = '-apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif';
        g.fillStyle = '#1d1b19'; g.font = `600 30px ${SANS}`; g.textBaseline = 'top';
        g.fillText(`${PROJEKT || ''} – ${talia}` + (stron > 1 ? ` (${s + 1}/${stron})` : ''), KATALOG.margines, KATALOG.margines);
        g.fillStyle = '#6b6560'; g.font = `18px ${SANS}`;
        g.fillText(`${awersy.length} kart, ${awersy.reduce((a, x) => a + x.kopie, 0)} z kopiami · ${wmm}×${hmm} mm`, KATALOG.margines, KATALOG.margines + 36);
        for (let i = 0; i < czesc.length; i++) {
          const { karta, kopie, rewers: jestRewers } = czesc[i];
          status(`Katalog ${talia}: ${s * naStrone + i + 1}/${lista.length}…`);
          const x = KATALOG.margines + (i % kol) * kom, y = KATALOG.margines + KATALOG.naglowek + Math.floor(i / kol) * rz;
          const bmp = await createImageBitmap(await obrazKarty(karta, { dpi: KATALOG.dpi * 2, format: 'jpg' }));
          g.imageSmoothingQuality = 'high';
          g.drawImage(bmp, x, y, tw, th);
          g.strokeStyle = '#c9c4bd'; g.lineWidth = 1; g.strokeRect(x + 0.5, y + 0.5, tw - 1, th - 1);
          if (karta.classList.contains('za-dlugi')) { g.strokeStyle = '#d00'; g.lineWidth = 4; g.strokeRect(x - 2, y - 2, tw + 4, th + 4); }
          if (jestRewers) { g.strokeStyle = '#2f6fd6'; g.lineWidth = 4; g.strokeRect(x - 3, y - 3, tw + 6, th + 6); }
          // Podpis: „ID Nazwa” (z tytułu karty, bez nazwy talii) i liczba kopii; przycięty do szerokości miniatury.
          let t = jestRewers ? 'Rewers' : (karta.title || '').replace(talia + ' ', '') + (kopie > 1 ? ` ×${kopie}` : '');
          g.fillStyle = jestRewers ? '#2f6fd6' : karta.classList.contains('za-dlugi') ? '#c00' : '#1d1b19'; g.font = `600 17px ${SANS}`;
          while (t.length > 1 && g.measureText(t).width > tw) t = t.slice(0, -2) + '…';
          g.fillText(t, x, y + th + 8);
        }
        const nazwa = slowoPliku(PROJEKT) + '_' + slowoPliku(talia) + (stron > 1 ? '_' + (s + 1) : '') + '.jpg';
        wynik.push({ nazwa, blob: await new Promise((ok) => c.toBlob(ok, 'image/jpeg', 0.9)), talia, karty: czesc.filter((x) => !x.rewers).length, zaDlugie });
      }
    }
  } finally { $('filtr').value = filtr; applyFilter(); }
  return wynik;
}

// Zapis katalogu: cel 'katalog' = Export/katalog (Plik → Eksport → Katalog…),
// cel 'zlecenie' = .generator/katalog (zlecenie z pliku .generator/zlecenia/katalog, np. od Claude).
async function zapiszKatalog(o = {}, cel = 'katalog') {
  return naWylacznosc(async () => {
    const folder = await APP.eksportStart(cel);
    if (!folder) { status('Katalog anulowany.'); return null; }
    const strony = await katalogPng(o);
    for (const s of strony) await APP.eksportPlik(s.nazwa, new Uint8Array(await s.blob.arrayBuffer()));
    status(strony.length ? `Zapisano katalog: ${strony.length} plików JPG w ${folder}` : 'Katalog: brak kart do pokazania.');
    if (cel === 'katalog') { APP.eksportKoniec(); punktHistorii('katalog talii'); }
    const talie = new Map();
    for (const s of strony) {
      const t = talie.get(s.talia) || talie.set(s.talia, { nazwa: s.talia, pliki: [], karty: 0, zaDlugie: s.zaDlugie }).get(s.talia);
      t.pliki.push(s.nazwa); t.karty += s.karty;
    }
    return { folder, pliki: strony.map((s) => s.nazwa), talie: [...talie.values()] };
  });
}
async function oknoKatalogu() {
  const r = await otworzOkno('katalog');
  if (!r) return;
  try { return await zapiszKatalog(r.opcje, 'katalog'); }
  catch (e) { status('Katalog nie powiódł się: ' + ((e && e.message) || e)); console.error(e); }
}
// Zlecenie z pliku (wywołuje aplikacja): wynik z Uwagami, kartami za długimi i stanem edytora.
async function zlecenieKatalogu(o = {}) {
  try {
    const r = await zapiszKatalog(o, 'zlecenie');
    return { ok: !!r, ...(r || {}), uwagi: ($('uwagi').innerText || '').split('\n').map((x) => x.trim()).filter((x) => x && x !== 'Uwagi:'),
      zaDlugie: [...$('podglad').querySelectorAll('.karta.za-dlugi:not(.rewers)')].map((k) => k.title).filter((t, i, a) => a.indexOf(t) === i),
      status: $('status').textContent, niezapisaneZmiany: !!(typeof ED !== 'undefined' && ED.zmiany) };
  } catch (e) { return { ok: false, blad: String((e && e.message) || e) }; }
}
Object.assign(window, { katalogPng, zapiszKatalog, oknoKatalogu, zlecenieKatalogu });

// ── Zlecenia z pliku dla całej gry (pkt 35) ─────────────────────────────────
// Aplikacja (main.js) co 3 s szuka plików .generator/zlecenia/<polecenie> w otwartym projekcie i woła
// wykonajZlecenie(polecenie, { klucz: 'wartość' }). Brak klucza = ostatnie ustawienie z okna (USTAWIENIA_OKIEN)
// albo domyślne; zlecenie tych ustawień nie zmienia. Przy niezapisanych zmianach w edytorze karty powstają
// z wersji szablonu na dysku (wynik: niezapisaneZmiany = true), a po zleceniu wraca podgląd z edytora.
const KLUCZE_ZLECEN = {
  katalog: ['talie', 'id'],
  stan: [],
  raport: ['drukarnia'],
  pdf: ['uklad', 'ciecie', 'rewersy', 'wspolnearkusze', 'strony', 'szkic', 'spad', 'przesunieciex', 'przesunieciey', 'talie', 'id', 'tylkozmienione', 'profil', 'nadrukczerni', 'plik'],
  obrazki: ['dpi', 'format', 'talie', 'id', 'rewersy'],
  pcio: ['dpi', 'talie', 'id'],
};
const ALIASY_ZLECEN = { talia: 'talie', rewers: 'rewersy', zmienione: 'tylkozmienione', rozdzielczosc: 'dpi', wspolne: 'wspolnearkusze', nadruk: 'nadrukczerni' };
const OKNO_ZLECENIA = { pdf: 'druk', obrazki: 'obrazki', pcio: 'pcio' };
const nazwyTalii = () => [...$('podglad').querySelectorAll('.talia')].map((s) => s.dataset.talia);

function opcjeZlecenia(polecenie, surowe = {}) {
  const dozwolone = KLUCZE_ZLECEN[polecenie];
  if (!dozwolone) throw new Error(`nieznane zlecenie „${polecenie}” (są: ${Object.keys(KLUCZE_ZLECEN).join(', ')})`);
  const bledy = [], ostrzezenia = [], v = {};
  for (const [k0, wart] of Object.entries(surowe)) {
    const k1 = plain(k0).replace(/_/g, ''), k = ALIASY_ZLECEN[k1] || k1;
    if (!dozwolone.includes(k)) { ostrzezenia.push(`nieznany klucz „${k0}” – pominięty`); continue; }
    v[k] = String(wart).trim();
  }
  const okno = OKNO_ZLECENIA[polecenie];
  const o = okno ? { ...OKNA[okno].domyslne, ...(USTAWIENIA_OKIEN[okno] || {}) } : {};
  const lista = (x) => x.split(',').map((y) => y.trim()).filter(Boolean);
  const tak = (k) => {
    const x = plain(v[k]);
    if (/^(tak|t|true|1|yes)$/.test(x)) return true;
    if (/^(nie|n|false|0|no)$/.test(x)) return false;
    bledy.push(`${k}: „${v[k]}” – wpisz tak albo nie`);
  };
  const wybor = (k, mozliwe, mapa = {}) => {
    const x = mapa[plain(v[k])] || plain(v[k]);
    if (mozliwe.includes(x)) return x;
    bledy.push(`${k}: „${v[k]}” – możliwe: ${mozliwe.join(', ')}`);
  };
  const liczba = (k, min, max) => {
    const x = parseFloat(v[k].replace(',', '.'));
    if (Number.isFinite(x) && x >= min && x <= max) return x;
    bledy.push(`${k}: „${v[k]}” – liczba od ${min} do ${max}`);
  };
  if (v.talie !== undefined) {
    o.talie = lista(v.talie); o.pominTalie = [];
    const sa = nazwyTalii(), jest = new Set(sa.map(plain));
    // pcio: nieznana talia = ostrzeżenie (jak nieznane ID), eksport pozostałych; inne zlecenia – błąd.
    const zgloszenia = polecenie === 'pcio' ? ostrzezenia : bledy;
    for (const t of o.talie) if (!jest.has(plain(t))) zgloszenia.push(`nie ma talii „${t}” (są: ${sa.join(', ')})`);
  }
  if (v.id !== undefined) o.id = lista(v.id);
  if (v.uklad !== undefined) o.uklad = wybor('uklad', ['a4', 'pojedyncze', 'drukarnia'], { osobne: 'pojedyncze' });
  if (v.ciecie !== undefined) o.ciecie = wybor('ciecie', ['znaczniki', 'nozyczki', 'oba'], { linie: 'nozyczki' });
  if (v.rewersy !== undefined) o.rewersy = tak('rewersy');
  if (v.wspolnearkusze !== undefined) o.wspolne = tak('wspolnearkusze');
  if (v.strony !== undefined) o.strony = wybor('strony', ['osobno', 'naprzemian'], { przemian: 'naprzemian', na_przemian: 'naprzemian', osobne: 'osobno' });
  if (v.drukarnia !== undefined) o.drukarnia = tak('drukarnia');
  if (v.szkic !== undefined) o.szkic = tak('szkic');
  if (v.spad !== undefined) o.spad = liczba('spad', 0, 10);
  if (v.przesunieciex !== undefined) o.przesuniecieX = liczba('przesunieciex', -10, 10);
  if (v.przesunieciey !== undefined) o.przesuniecieY = liczba('przesunieciey', -10, 10);
  if (v.dpi !== undefined) o.dpi = Math.round(liczba('dpi', 50, 600) || 0);
  if (v.format !== undefined) o.format = wybor('format', ['jpg', 'png'], { jpeg: 'jpg' });
  if (v.plik !== undefined) o.plik = v.plik;
  if (polecenie === 'pdf') o.ktore = v.tylkozmienione !== undefined && tak('tylkozmienione') ? 'zmienione' : 'wszystkie';
  // CMYK w zleceniu tylko z kluczem profil (bez niego RGB jak do 0.5.10 – także gdy okno ma CMYK włączony).
  if (polecenie === 'pdf') {
    o.cmyk = false;
    if (v.profil !== undefined && !/^(nie|brak|rgb|0|false|no)$/.test(plain(v.profil))) {
      const k = plain(v.profil).replace(/[\s_-]/g, '');
      o.cmyk = true;
      const znany = ['fogra39', 'fogra51'].includes(k);
      o.profil = znany ? k : v.profil;
      if (!znany && !/\.ic[cm]$/i.test(v.profil)) bledy.push(`profil: „${v.profil}” – możliwe: fogra39, fogra51, rgb albo ścieżka do pliku .icc`);
      if (o.uklad !== 'drukarnia') bledy.push('profil: CMYK działa tylko w układzie drukarnia (dopisz uklad = drukarnia)');
    }
    // Nadruk czerni K100 (#92): bez klucza – ustawienie z okna (domyślnie tak); bez CMYK klucz nic nie zmienia.
    if (v.nadrukczerni !== undefined) {
      o.nadrukCzerni = tak('nadrukczerni');
      if (!o.cmyk) ostrzezenia.push('nadrukczerni: działa tylko w PDF CMYK (z kluczem profil) – pominięty');
    }
  }
  if (polecenie === 'obrazki') o.ktore = 'wszystkie';
  if (bledy.length) throw new Error(bledy.join('; '));
  return { o, ostrzezenia };
}

// Uwagi, karty za długie i stan edytora – wspólne pola wyniku każdego zlecenia.
function stanZlecenia() {
  return {
    uwagi: ($('uwagi').innerText || '').split('\n').map((x) => x.trim()).filter((x) => x && x !== 'Uwagi:'),
    zaDlugie: [...$('podglad').querySelectorAll('.karta.za-dlugi:not(.rewers)')].map((k) => k.title).filter((t, i, a) => a.indexOf(t) === i),
    niezapisaneZmiany: !!ED.zmiany,
  };
}

// Talie i karty (każdy wiersz danych raz, z liczbą kopii) ze stanem względem ostatniego PDF.
function stanKart() {
  const talie = [...$('podglad').querySelectorAll('.talia')].map((s) => {
    const nazwa = s.dataset.talia, wiersze = new Map();
    for (const k of s.querySelectorAll('.karta:not(.rewers)')) {
      let w = wiersze.get(k.dataset.row);
      if (!w) {
        const przed = nazwa + ' ' + k.dataset.id;
        w = { id: k.dataset.id, nazwa: k.title.startsWith(przed) ? k.title.slice(przed.length).trim() : k.title, kopie: 0 };
        wiersze.set(k.dataset.row, w);
      }
      w.kopie++;
      if (k.classList.contains('zmieniona')) w.zmieniona = true;
      if (k.classList.contains('nowa')) w.nowa = true;
      if (k.classList.contains('za-dlugi')) w.zaDluga = true;
    }
    const karty = [...wiersze.values()];
    return { nazwa, rewers: !!s.querySelector('.karta.rewers'), karty: karty.length, kopie: karty.reduce((a, k) => a + k.kopie, 0), lista: karty };
  });
  const jakie = (cecha) => talie.flatMap((t) => t.lista.filter((k) => k[cecha]).map((k) => `${t.nazwa} ${k.id}`));
  return { projekt: PROJEKT, wersja: WERSJA || null, ostatniPdf: ODCISKI ? ODCISKI.data : null,
    karty: talie.reduce((a, t) => a + t.karty, 0), kopie: talie.reduce((a, t) => a + t.kopie, 0),
    zmienione: ODCISKI ? jakie('zmieniona') : null, nowe: ODCISKI ? jakie('nowa') : null, talie };
}

// Raport projektu (to samo co panel Raport) jako lista sekcji z pozycjami tekstowymi.
async function raportJson(o = {}) {
  const d = document.createElement('div');
  d.innerHTML = await raportProjektu({ drukarnia: !!o.drukarnia });     // zlecenie: tryb drukarni tylko z kluczem
  return [...d.querySelectorAll('h3')].map((h) => {
    const nast = h.nextElementSibling;
    const pozycje = nast && nast.tagName === 'UL' ? [...nast.querySelectorAll('li')].map((li) => li.textContent.trim()) : [];
    return { tytul: h.textContent.trim(), ok: !!(nast && nast.classList.contains('ok')), pozycje };
  });
}

const ZADANIA_ZLECEN = {
  async katalog(o) {
    const r = await zapiszKatalog({ talie: o.talie, id: o.id }, 'zlecenie');
    return { ok: !!r, ...(r || {}) };
  },
  async stan() { return { ok: true, ...stanKart() }; },
  async raport(o) {
    const wynik = { ok: true, raport: await raportJson(o) };
    if (o.drukarnia) wynik.drukarnia = OSTATNI_RAPORT_DRUKARNI;     // pełne listy (w raporcie – skrót)
    return wynik;
  },
  async pdf(o) {
    const karty = kartyEksportu(o);
    if (!karty.length) throw new Error(o.ktore === 'zmienione' ? 'brak kart zmienionych od ostatniego PDF' : 'brak kart do PDF – sprawdź talie i id');
    OSTATNI_CMYK = null;
    const pliki = await zapiszPdf({ ...o, zlecenie: true });
    if (!pliki) throw new Error('PDF nie został zapisany');
    const wynik = { ok: true, pliki, karty: karty.length, strony: $('druk').querySelectorAll('.arkusz').length || null };
    // A4: liczba arkuszy awersów i rewersów (talie na wspólnych arkuszach – #34).
    if (PLAN_DRUKU && PLAN_DRUKU.arkusze) wynik.arkusze = { ...PLAN_DRUKU.arkusze, wspolne: o.wspolne !== false };
    // CMYK: profil, wersja Ghostscripta i kontrola każdego pliku (rgb = 0, czern = liczba „0 0 0 1 k”, obrazki, TrimBox).
    if (o.cmyk) wynik.cmyk = OSTATNI_CMYK;
    const plan = PLAN_DRUKU;
    if (o.uklad === 'drukarnia' && plan) {
      // Strony w każdym pliku i rozmiar strony w mm (TrimBox = strona − spad z każdej strony).
      wynik.stronyPlikow = plan.pliki.map((_, n) => plan.strony.filter((x) => x.plik === n).length).filter(Boolean);
      wynik.strona = [plan.szer, plan.wys].map((x) => Math.round(x * 100) / 100);
      wynik.spad = plan.spad;
      // Spad z szablonu (#84): false = żadna talia go nie deklaruje (spad dorabiany); ostrzeżenia jak w oknie.
      wynik.spadZSzablonu = !!plan.spadZSzablonu;
      if (plan.bezSpadu && plan.bezSpadu.length) wynik.bezSpadu = plan.bezSpadu;
      if (plan.ostrzezenia && plan.ostrzezenia.length) wynik.ostrzezenia = [...(wynik.ostrzezenia || []), ...plan.ostrzezenia];
    }
    return wynik;
  },
  async obrazki(o) {
    const r = await eksportObrazkow({ ...o, zlecenie: true });
    if (!r) throw new Error('brak kart do eksportu – sprawdź talie i id');
    return { ok: true, pliki: r.nazwy.map((n) => r.folder + '/' + n) };
  },
  async pcio(o) {
    const r = await exportPcio({ ...o, zlecenie: true });
    if (!r) throw new Error('brak kart do pokoju playingcards.io – sprawdź talie i id');
    return { ok: true, pliki: [r.plik], talie: r.talie, holdery: r.holdery, karty: r.karty, ...(r.ostrzezenia.length ? { ostrzezenia: r.ostrzezenia } : {}) };
  },
};

async function wykonajZlecenie(polecenie, surowe = {}) {
  let o, ostrzezenia = [];
  try { ({ o, ostrzezenia } = opcjeZlecenia(polecenie, surowe)); }
  catch (e) { return { ok: false, pliki: [], blad: String(e.message || e), ...stanZlecenia() }; }
  const zDysku = !!(SZABLON && ED.zmiany);
  let wynik;
  ZLECENIE_TRWA = true;
  try {
    if (zDysku) { ZLECENIE_Z_DYSKU = true; await loadFromServer(); lastStamp = await serverStamp(); }
    else {
      // Zlecenie zawsze na aktualnych plikach z dysku – także gdy automatyczne odświeżanie stoi
      // (okno zasłonięte, odświeżanie wyłączone w menu Widok; issue #30).
      while (SPRAWDZANIE) await new Promise((r) => setTimeout(r, 50));
      await KOLEJKA_BUDOWY;
      if (serverPaths.length) {
        const stamp = await serverStamp();
        if (stamp !== lastStamp) { await loadFromServer(); lastStamp = await serverStamp(); }
      }
    }
    if (o.id) {
      const sa = new Set([...$('podglad').querySelectorAll('.karta:not(.rewers)')].map((k) => plain(k.dataset.id || '')));
      for (const id of o.id) if (!sa.has(plain(id))) ostrzezenia.push(`nie ma karty o ID „${id}”`);
    }
    try { wynik = { pliki: [], ...(await ZADANIA_ZLECEN[polecenie](o)) }; }
    catch (e) { wynik = { ok: false, pliki: [], blad: String((e && e.message) || e) }; }
    Object.assign(wynik, stanZlecenia(), { status: $('status').textContent });
  } finally {
    if (zDysku) { ZLECENIE_Z_DYSKU = false; try { await podgladNaZywo(); } catch (e) { /* podgląd odświeży się sam */ } }
    ZLECENIE_TRWA = false;
  }
  if (ostrzezenia.length) wynik.ostrzezenia = [...ostrzezenia, ...(wynik.ostrzezenia || [])];
  wynik.opcje = { ...o };
  return wynik;
}
Object.assign(window, { wykonajZlecenie, opcjeZlecenia, stanKart, raportJson });

// ── Eksport do playingcards.io ───────────────────────────────────────────────
// Tworzy nowy pokój (.pcio): każda talia to osobny stos (holder) z kartami zakrytymi,
// stosy w rzędach obok siebie. Resztę stołu właściciel ustawia sam w playingcards.io.

const uuid = () => (crypto.randomUUID ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));

// Obrazki kart jak w eksporcie obrazków (JPG, rozdzielczość z okna).
const cardToJpeg = (el, dpi) => obrazKarty(el, { dpi, format: 'jpg' });

const PCIO = { dluzszyBok: 160, odstep: 40, margines: 40, szerokoscStolu: 1500, ramka: 4 };

// o: { dpi, pominTalie } – z okna „Pokój playingcards.io”; zlecenie z pliku: także talie, id (jak kartyEksportu).
async function exportPcio(o = {}) {
  if (EKSPORT_TRWA) return;
  return naWylacznosc(() => eksportujPcio(o));
}
async function eksportujPcio(o = {}) {
  const dpi = +o.dpi || CONFIG.jpgDpi;
  if (!window.htmlToImage) await loadScript('https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js');
  if (!window.JSZip) await loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');
  const widgets = [], assets = new Map(), report = [], ostrzezenia = [];
  let z = 1, x = PCIO.margines, y = PCIO.margines, wysRzedu = 0;

  // Wszystkie talie, także odfiltrowane w podglądzie.
  const filtr = $('filtr').value; $('filtr').value = ''; applyFilter();
  try {
    // Karty jak w innych eksportach (pominTalie z okna, talie i id ze zlecenia – issue #32), stos na talię.
    const wybrane = new Set(kartyEksportu({ pominTalie: o.pominTalie, talie: o.talie, id: o.id }));
    for (const section of $('podglad').querySelectorAll('.talia')) {
      const nazwa = section.dataset.talia;
      const karty = [...section.querySelectorAll('.karta:not(.rewers)')].filter((k) => wybrane.has(k));
      if (!karty.length) continue;
      // Rozmiar karty w jednostkach stołu: dłuższy bok = 160, proporcje jak KARTA.
      const [wmm, hmm] = cardMm(karty[0]);
      const cw = Math.round(wmm >= hmm ? PCIO.dluzszyBok : PCIO.dluzszyBok * wmm / hmm);
      const ch = Math.round(wmm >= hmm ? PCIO.dluzszyBok * hmm / wmm : PCIO.dluzszyBok);
      const hw = cw + 2 * PCIO.ramka, hh = ch + 2 * PCIO.ramka;
      if (x > PCIO.margines && x + hw > PCIO.szerokoscStolu) { x = PCIO.margines; y += wysRzedu + PCIO.odstep; wysRzedu = 0; }

      const holder = { id: uuid(), type: 'holder', x, y, z: z++, width: hw, height: hh, label: nazwa, dragging: null };
      const deck = { id: uuid(), type: 'cardDeck', parent: holder.id, x, y, z: z++, cardWidth: cw, cardHeight: ch,
        showUnflipped: true, enlarge: 'normal', onRemoveFromHand: null, dragging: null, cardTypes: {},
        faceTemplate: { includeBorder: 'heavy', includeRadius: true,
          objects: [{ type: 'image', x: 0, y: 0, w: cw, h: ch, color: 'white', valueType: 'dynamic', value: 'image' }] } };

      // Wzory kart (wiersze danych) i kopie.
      const wzory = new Map();
      for (const el of karty) { const k = el.dataset.row; if (!wzory.has(k)) wzory.set(k, { el, n: 0 }); wzory.get(k).n++; }
      const cards = [];
      let i = 0;
      for (const { el, n } of wzory.values()) {
        status(`playingcards.io: ${nazwa} ${++i}/${wzory.size}…`);
        const plik = uuid() + '.jpg';
        assets.set(plik, await cardToJpeg(el, dpi));
        const typ = 'type-' + uuid();
        deck.cardTypes[typ] = { image: 'package://userassets/' + plik, label: el.title || el.dataset.id };
        for (let j = 0; j < n; j++) cards.push({ id: uuid(), type: 'card', cardType: typ, deck: deck.id, parent: holder.id,
          x: x + PCIO.ramka, y: y + PCIO.ramka, z: 0, faceup: false, owner: null, layoutStackParent: null, r: 0 });
      }

      // Rewers z generatora; bez [REWERS] – kolorowy rewers z nazwą talii. Rewersy zależne od karty (#47, decyzja 4
      // z 26.10.2026): stos ma jeden backTemplate – najczęstszy rewers wybranych kart + ostrzeżenie (rewers dynamiczny – później).
      let back = section.querySelector('.karta.rewers');
      if (REWERSY_KART.has(nazwa)) {
        const ile = new Map();
        for (const k of karty) { const b = rewersKarty(k); if (b) ile.set(b, (ile.get(b) || 0) + 1); }
        const [naj, n] = [...ile.entries()].sort((a, b) => b[1] - a[1])[0] || [null, 0];
        back = naj;
        if (ile.size > 1) ostrzezenia.push(`talia ${nazwa} ma ${ile.size} ${[2, 3, 4].includes(ile.size % 10) && (ile.size % 100 < 10 || ile.size % 100 >= 20) ? 'różne rewersy' : 'różnych rewersów'} – w pokoju użyto najczęstszego (${n} z ${karty.length} kart)`);
      }
      let tylObiekty;
      if (back) {
        const plik = uuid() + '.jpg';
        assets.set(plik, await cardToJpeg(back, dpi));
        tylObiekty = [{ type: 'image', x: 0, y: 0, w: cw, h: ch, color: 'transparent', valueType: 'static', value: 'package://userassets/' + plik }];
      } else {
        tylObiekty = [{ type: 'image', x: 0, y: 0, w: cw, h: ch, color: '#3d3a36', valueType: 'static', value: '' },
          { type: 'text', x: 8, y: ch / 2 - 10, w: cw - 16, fontSize: 16, valueType: 'static', value: nazwa, textAlign: 'center', textFont: null, color: 'rgb(255,255,255)' }];
      }
      deck.backTemplate = { includeBorder: 'heavy', includeRadius: true, objects: tylObiekty };

      for (const c of cards) c.z = z++;
      widgets.push(holder, deck, ...cards);
      report.push(`${nazwa}: ${cards.length} kart`);
      x += hw + PCIO.odstep; wysRzedu = Math.max(wysRzedu, hh);
    }
  } finally { $('filtr').value = filtr; applyFilter(); }
  if (!widgets.length) { status('Eksport do playingcards.io: brak kart.'); return; }

  const zip = new JSZip();
  zip.file('schemaVersion', '8');
  zip.file('widgets.json', JSON.stringify(widgets));
  const folder = zip.folder('userassets');
  for (const [plik, blob] of assets) folder.file(plik, blob);
  const dane = await zip.generateAsync({ type: 'uint8array', compression: 'STORE' });
  const nazwa = PROJEKT + ' – playingcards.pcio';
  const zapisany = await APP.zapiszPcio(nazwa, dane);
  if (!zapisany) { status('Eksport do playingcards.io anulowany.'); return; }
  punktHistorii('playingcards.io' + (o.zlecenie ? ' (zlecenie)' : ''));
  status(`Zapisano ${zapisany} (${(dane.length / 1048576).toFixed(1)} MB) · ${report.join(' · ')} · w playingcards.io: Edit Table → Import room`
    + (ostrzezenia.length ? ' · Uwaga: ' + ostrzezenia.join('; ') : ''));
  return { plik: zapisany, talie: report, holdery: widgets.filter((w) => w.type === 'holder').length,
           karty: widgets.filter((w) => w.type === 'card').length, obrazki: assets.size, ostrzezenia };
}
window.exportPcio = exportPcio;


// ── Edytor szablonu ──────────────────────────────────────────────────────────
// Pole tekstowe z kolorowaniem składni (warstwa <pre> pod przezroczystym <textarea>),
// numerami wierszy, zaznaczeniem błędów i podglądem kart na żywo. Zapis ⌘S przez aplikację.
const ED = { dysk: null, zmiany: false, konflikt: null, bledy: new Map(), tylkoOdczyt: false, czasomierz: 0 };
const edPole = $('edPole');

const RE_ARG = /("(?:[^"\\]|\\.)*"?)|(\[[^\]\n]*\]?)|(\{[^}\n]*\}?)|(#[0-9a-fA-F]{3,8}\b)|(?<![<\p{L}\p{N}_])([\p{L}_][\p{L}\p{N}_]*)(?=\s*=)|((?<![\p{L}\p{N}_.])-?\d+(?:\.\d+)?(?![\p{L}\p{N}_]))/gu;
const kolorujPola = (t) => esc(t)
  .replace(/\[[^\]]*\]/g, (m) => `<span class="sk-pole">${m}</span>`)
  .replace(/\{[^}]*\}/g, (m) => `<span class="sk-ikona">${m}</span>`);
function kolorujArgumenty(t) {
  let out = '', last = 0, m;
  RE_ARG.lastIndex = 0;
  while ((m = RE_ARG.exec(t))) {
    if (!m[0]) { RE_ARG.lastIndex++; continue; }
    out += esc(t.slice(last, m.index));
    const [x, str, pl, ik, kol, opc] = m;
    if (str) out += `<span class="sk-str">${kolorujPola(str)}</span>`;
    else if (pl) out += `<span class="sk-pole">${esc(pl)}</span>`;
    else if (ik) out += `<span class="sk-ikona">${esc(ik)}</span>`;
    else if (kol) out += `<span class="sk-kolor" style="--sw:${kol}">${esc(kol)}</span>`;
    else if (opc) out += `<span class="sk-opc">${esc(opc)}</span>`;
    else out += `<span class="sk-liczba">${esc(x)}</span>`;
    last = RE_ARG.lastIndex;
  }
  return out + esc(t.slice(last));
}
function kolorujLinie(l) {
  if (/^\s*(;|#|\/\/)/.test(l)) return `<span class="sk-kom">${esc(l)}</span>`;
  let q = false, ci = -1;                                   // komentarz na końcu linii (poza cudzysłowem)
  for (let i = 0; i < l.length; i++) {
    const c = l[i];
    if (c === '"' && l[i - 1] !== '\\') q = !q;
    else if (!q && (c === ';' || (c === '/' && l[i + 1] === '/')) && /\s/.test(l[i - 1] || ' ')) { ci = i; break; }
  }
  const kod = ci >= 0 ? l.slice(0, ci) : l, kom = ci >= 0 ? l.slice(ci) : '';
  let h;
  if (/^\s*\[[^\]]*\]\s*$/.test(kod)) h = `<span class="sk-sek">${esc(kod)}</span>`;
  else {
    const m = /^(\s*)([^=]*?)(\s*=)([\s\S]*)$/.exec(kod);
    h = m ? esc(m[1]) + `<span class="sk-kmd">${esc(m[2])}</span>` + esc(m[3]) + kolorujArgumenty(m[4]) : esc(kod);
  }
  return h + (kom ? `<span class="sk-kom">${esc(kom)}</span>` : '');
}

function rysujEdytor() {
  const linie = edPole.value.split('\n');
  $('edKolory').innerHTML = linie.map((l, i) =>
    `<div class="l${ED.bledy.has(i + 1) ? ' blad' : ''}">${kolorujLinie(l)}</div>`).join('') + '<div class="l"></div><div class="l"></div>';
  $('edNumery').innerHTML = linie.map((l, i) => ED.bledy.has(i + 1)
    ? `<div class="blad" title="${esc(ED.bledy.get(i + 1).join('\n'))}">${i + 1}</div>` : `<div>${i + 1}</div>`).join('') + '<div></div><div></div>';
  przewinWarstwy();
}
function przewinWarstwy() {
  $('edKolory').scrollTop = edPole.scrollTop; $('edKolory').scrollLeft = edPole.scrollLeft;
  $('edNumery').scrollTop = edPole.scrollTop;
}
function edytorBledy(linie) {
  ED.bledy = linie;
  $('edBledy').innerHTML = [...linie.entries()].sort((a, b) => a[0] - b[0])
    .map(([n, t]) => `<div data-linia="${n}"><b>wiersz ${n}</b>${esc(t.join(' · '))}</div>`).join('');
  for (const d of $('edBledy').querySelectorAll('[data-linia]')) d.onclick = () => idzDoLinii(+d.dataset.linia);
  rysujEdytor();
}
function ustawZmiany(z) {
  ED.zmiany = z;
  $('edStan').textContent = ED.tylkoOdczyt ? 'tylko do odczytu' : z ? '● niezapisane zmiany' : 'zapisano';
  $('edStan').classList.toggle('zmiany', z);
  $('edZapisz').disabled = !z || ED.tylkoOdczyt;
  if (APP) APP.edytorZmiany(z);
}
// Wywoływane przy każdym wczytaniu szablonu z dysku; zwraca tekst, z którego budujemy karty.
function edytorZDysku(dysk) {
  if (ZLECENIE_Z_DYSKU) return dysk;                       // zlecenie z pliku: karty z wersji na dysku
  if (ED.dysk === null || !ED.zmiany) {
    if (dysk !== edPole.value) {
      const [a, b] = [edPole.selectionStart, edPole.selectionEnd];
      edPole.value = dysk;
      edPole.setSelectionRange(Math.min(a, dysk.length), Math.min(b, dysk.length));
      rysujEdytor();
    }
    ED.dysk = dysk;
    return dysk;
  }
  if (dysk !== ED.dysk && dysk !== edPole.value) { ED.konflikt = dysk; $('edKonflikt').hidden = false; }
  return edPole.value;
}
async function zapiszSzablon() {
  if (!SZABLON || ED.tylkoOdczyt || !APP) return false;
  try { await APP.zapiszSzablon(edPole.value); }

// Zapis PDF wprost do pliku (tylko w aplikacji) – wydruk w dokładnym rozmiarze, bez okna drukowania.
// o: { uklad, rewersy, szkic, ktore, pominTalie } – z okna Druk / PDF.
async function zapiszPdf(o = {}) {
  const karty = kartyEksportu(o);
  if (!karty.length) { status('Brak kart do PDF – sprawdź wybór kart i talii.'); return; }
  const plan = buildPrint({ ...o, karty });
  // Drukarnia: plan idzie do main.js – dokładny rozmiar stron, TrimBox, podział na awersy i rewersy.
  const druk = o.uklad === 'drukarnia' ? { szer: plan.szer, wys: plan.wys, spad: plan.spad, pliki: plan.pliki, strony: plan.strony } : null;
  // CMYK (etap 2 z #66): okno – tylko gdy jest Ghostscript (inaczej opcja wyszarzona); zlecenie – z kluczem profil.
  // nadruk (#92): czarny tekst K100 nadrukowany na tło (/OP) – domyślnie tak, jak w InDesignie.
  if (druk && o.cmyk && (o.zlecenie || (CMYK_STAN && CMYK_STAN.gs.ok))) druk.cmyk = { profil: o.profil || 'fogra39', nadruk: o.nadrukCzerni !== false };
  const info = await APP.info();
  const nazwa = (PROJEKT || info.nazwa || 'karty') + ({ pojedyncze: ' – karty pojedynczo', drukarnia: ' – drukarnia' }[o.uklad] || ' – karty A4')
    + (o.ktore === 'zaznaczone' ? ' – wybrane' : '') + (o.ktore === 'zmienione' ? ' – zmienione' : '') + (o.szkic ? ' – szkic' : '');
  status('Zapisywanie PDF…');
  try {
    // Zlecenie z pliku: zapis bez okna – o.plik (ścieżka w projekcie) albo nazwa jak przy ręcznym zapisie.
    // Wynik: lista plików (Drukarnia – awersy i rewersy osobno daje dwa) albo null (anulowano).
    const w = o.zlecenie ? await APP.zapiszPdfZlecenia(o.plik || nazwa + '.pdf', druk) : await APP.zapiszPdf(nazwa, druk);
    // CMYK: { pliki, cmyk } – kontrola z main.js; inaczej ścieżka albo lista ścieżek.
    OSTATNI_CMYK = (w && w.cmyk) || null;
    const pliki = w ? [].concat(w.pliki || w) : null;
    const uwagi = pliki && plan.ostrzezenia && plan.ostrzezenia.length ? ' · Uwaga: ' + plan.ostrzezenia.join('; ') : '';
    status(pliki ? `Zapisano PDF${OSTATNI_CMYK ? ' w CMYK (' + OSTATNI_CMYK.profil + ')' : ''}: ` + pliki.join(', ') + uwagi : 'Zapis PDF anulowany.');
    if (pliki) { await zapamietajDruk(karty); punktHistorii(({ pojedyncze: 'PDF – osobne strony', drukarnia: OSTATNI_CMYK ? 'PDF – drukarnia CMYK' : 'PDF – drukarnia' }[o.uklad] || 'PDF A4') + (o.zlecenie ? ' (zlecenie)' : '')); }
    return pliki;
  } catch (e) {
    // Błąd z main (IPC) ma przedrostek Electrona – w komunikacie i w wynik-pdf.json tylko treść.
    const m = String((e && e.message) || e).replace(/^Error invoking remote method '[^']+': (Error: )?/, '');
    status('Nie udało się zapisać PDF: ' + m);
    if (o.zlecenie) throw new Error(m);
  }
}

    `<button type="button" data-akcja="${a}"${a === domyslna ? ' class="domyslny"' : ''}>${t}</button>`).join('');

    // „inny plik .icc…” – okno wyboru pliku w main (sprawdza, czy to profil CMYK); anulowanie = poprzedni wybór.
    const wyborProfilu = form.querySelector('[name=profil]');
    if (wyborProfilu) {
      let poprzedni = wyborProfilu.value;
      wyborProfilu.onchange = async () => {
        if (wyborProfilu.value !== '__inny') { poprzedni = wyborProfilu.value; return; }
        const plik = await APP.cmykWybierzProfil();
        if (!plik) { wyborProfilu.value = poprzedni; return; }
        let o = [...wyborProfilu.options].find((x) => x.value === plik);
        if (!o) { o = new Option('plik: ' + plik.split('/').pop(), plik); wyborProfilu.insertBefore(o, wyborProfilu.lastElementChild); }
        wyborProfilu.value = poprzedni = plik;
      };
    }
    okno.oncancel = (e) => { e.preventDefault(); zamknij(null); };
    okno.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); $('oknoPrzyciski').querySelector('.domyslny').click(); } };
    okno.showModal();
    ($('oknoPrzyciski').querySelector('.domyslny') || okno).focus();
  });
}
window.otworzOkno = otworzOkno;
async function oknoObrazkow() {
  const r = await otworzOkno('obrazki');
  if (r) return eksportObrazkow(r.opcje);
}
async function oknoDruku(domyslna = 'pdf') {
  await odswiezCmyk();
  const r = await otworzOkno('druk', domyslna);
  if (!r) return;
  return r.akcja === 'drukuj' ? drukuj(r.opcje) : zapiszPdf(r.opcje);
}
async function oknoPcio() {
  const r = await otworzOkno('pcio');
  if (!r) return;
  try { return await exportPcio(r.opcje); }
  catch (e) { status('Eksport do playingcards.io nie powiódł się: ' + ((e && e.message) || e)); console.error(e); }
}
Object.assign(window, { oknoObrazkow, oknoDruku, oknoPcio });
$('obrazkiPrzycisk').onclick = () => oknoObrazkow();

// Ekran powitalny, gdy nie otwarto jeszcze szablonu.
async function startAplikacji() {
  const przyklady = await APP.przyklady();
  $('start').innerHTML = '<h2>KarKa <span class="opis">– Kawia Karciana</span></h2>' +
    '<p>Otwórz <b>plik szablonu</b> (.txt) swojej gry. Szablon wskazuje plik z kartami (CSV/XLSX), ' +
    'obrazki i czcionki – generator wczyta je sam.</p>' +
    '<p><button class="glowny" id="startOtworz">Otwórz szablon…</button> <button id="startNowy">Nowy projekt…</button></p>' +
    (przyklady.length ? '<h3>Albo zobacz przykład</h3><ul>' +
      przyklady.map((n) => `<li><a href="#" data-przyklad="${esc(n)}">${esc(n)}</a></li>`).join('') + '</ul>' : '');
  $('startOtworz').onclick = () => APP.otworzSzablon();
  $('startNowy').onclick = () => APP.nowyProjekt();
  for (const a of $('start').querySelectorAll('[data-przyklad]'))
    a.onclick = (e) => { e.preventDefault(); APP.otworzPrzyklad(a.dataset.przyklad); };
  status('');
}

// Start
(async () => {
  if (!APP) { $('start').innerHTML = '<p>Ten plik jest częścią aplikacji KarKa i działa tylko w niej.</p>'; return; }
  const info = await APP.info();
  AUTO_ODSWIEZANIE = info.auto !== false;
  try { USTAWIENIA_OKIEN = (await APP.eksportUstawienia()) || {}; } catch (e) { USTAWIENIA_OKIEN = {}; }
  if (!info.szablon) return startAplikacji();
  // Edytor szablonu
  ED.tylkoOdczyt = !!info.przyklad;
  edPole.readOnly = ED.tylkoOdczyt;
  $('edTylkoOdczyt').hidden = !ED.tylkoOdczyt;
  $('edNazwa').textContent = SZABLON;
  $('edytorPrzycisk').disabled = false;
  ustawZmiany(false);
  let otwarty = false;
  try { otwarty = localStorage.getItem('edytor') === '1'; } catch (e) { /* domyślnie zamknięty */ }
  if (otwarty) przelaczEdytor(true);
  loadFromServer();
})();
</script>
