# Buduje aplikację „KarKa” (Kawia Karciana, dawniej Generator kart) na macOS (Apple Silicon) i testuje ją na przykładach.
# - każda zmiana w main → wydanie v<wersja z app/package.json> z DMG, oznaczone jako najnowsze
#   (link w README: releases/latest/download/KarKa.dmg); wersja już wydana → tylko ostrzeżenie,
# - tag v* albo wydanie opublikowane ręcznie na GitHubie → plik dołączony do tego wydania,
# - pull request → tylko budowanie i testy (bez DMG; w Artifacts tylko wyniki-testow).
# Testy przykładów (#88, #101) – tryb zależy od zdarzenia (krok „Tryb testów”):
# - pr (pull request): pełny --test-edytor tylko na 07-gildie, w trzech procesach (grupy z app/scripts/grupy-testow.js:
#   zlecenia + zmienione + cmykTest, zakladki, reszta = dopełnienie), 08-wieze – blok spadSzablonu, pozostałe przykłady
#   --test-pdf; do 4 procesów naraz (app/scripts/testy-ci.js);
# - main (push do main po scaleniu przetestowanego PR-a): bez testów przykładów, tylko start, nowy projekt i nakładka;
# - pelny (ręcznie – workflow_dispatch, tag v*, wydanie opublikowane na GitHubie): --test-edytor na wszystkich przykładach
#   (też do 4 naraz).
# DMG, „Sprawdzenie DMG”, pliki aktualizacji i artefakt KarKa – tylko przy wydaniu (wszystko poza pull_request, #101).
# Czasy uruchomień (i najdłuższe bloki) trafiają do podsumowania przebiegu (Summary); ostrzeżenie przy uruchomieniu > 3 min
# i przebiegu PR > 10 min.
# Do wydania trafiają też pliki aktualizacji (app/aktualizacje.js): aktualizacja.json, kod.zip, KarKa.zip.
name: Aplikacja macOS

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['app/**', 'przyklady/**', '.github/workflows/aplikacja-mac.yml']
  pull_request:
    paths: ['app/**', 'przyklady/**', '.github/workflows/aplikacja-mac.yml']
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

# Nowy commit w PR przerywa poprzedni przebieg tego PR-a. Przebiegi na main, tagach i wydaniach nie są przerywane –
# anulowane przebiegi z 25–26.10.2026 zgubiły wydania v0.5.14 i v0.5.16 (#101); czekają w kolejce grupy.
concurrency:
  group: aplikacja-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - name: Tryb testów
        id: tryb
        run: |
          echo "START=$(date +%s)" >> "$GITHUB_ENV"
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            pull_request:*) tryb=pr ;;
            push:refs/tags/v*) tryb=pelny ;;
            push:*) tryb=main ;;
            *) tryb=pelny ;;                               # workflow_dispatch, release
          esac
          echo "tryb=$tryb" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Zależności
        run: npm ci

      - name: Zasoby (generator, przykłady, biblioteki, czcionki)
        run: npm run zasoby

      - name: Ghostscript (PDF w CMYK – testy modułu i aplikacji)
        run: brew install ghostscript

      - name: Test – historia wersji (moduł)
        run: node scripts/test-historia.js

      - name: Test – PDF dla drukarni (moduł)
        run: node scripts/test-drukarnia.js

      - name: Test – PDF w CMYK (moduł, Ghostscript)
        run: node scripts/test-cmyk.js

      - name: Test – aktualizacje (moduł, nakładka, ditto)
        run: node scripts/test-aktualizacje.js

      - name: Budowanie (Apple Silicon)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dir --arm64

      - name: Podpis ad hoc (bez konta Apple Developer)
        run: |
          app="dist/mac-arm64/KarKa.app"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"

      - name: Test – przykłady
        env:
          TRYB: ${{ steps.tryb.outputs.tryb }}
        run: |
          mkdir -p "$RUNNER_TEMP/test"
          bin="dist/mac-arm64/KarKa.app/Contents/MacOS/KarKa"
          # pr / pelny: plan uruchomień, 4 procesy naraz, czasy w Summary (scripts/testy-ci.js); main – bez przykładów.
          if [ "$TRYB" != main ]; then node scripts/testy-ci.js "$TRYB" --bin "$bin" --tmp "$RUNNER_TEMP" --razem 4; fi
          "$bin" --user-data-dir="$RUNNER_TEMP/ud" --test-pdf - "$RUNNER_TEMP/test/start.pdf"
          # Nowy projekt z szablonu startowego (nazwa z polskimi znakami, przecinkiem i cudzysłowem)
          "$bin" --user-data-dir="$RUNNER_TEMP/ud" --test-nowy "$RUNNER_TEMP/Złota Wyprawa, \"edycja\"" --test-pdf - "$RUNNER_TEMP/test/nowy.pdf" | tee "$RUNNER_TEMP/test/nowy.json"
          grep -q '"ok":true' "$RUNNER_TEMP/test/nowy.json"

      - name: Test – nakładka kodu w zbudowanej aplikacji
        run: |
          bin="dist/mac-arm64/KarKa.app/Contents/MacOS/KarKa"
          ud="$RUNNER_TEMP/ud-nakladka"
          node scripts/paczka-kodu.js "$RUNNER_TEMP/nakladka" --wersja 99.0.0
          mkdir -p "$ud/kod" && ditto -x -k "$RUNNER_TEMP/nakladka/kod.zip" "$ud/kod"
          node -e "const m=require('$RUNNER_TEMP/nakladka/aktualizacja.json');require('fs').writeFileSync('$ud/kod/nakladka.json',JSON.stringify({wersja:m.wersja,electron:m.electron}))"
          cp -R ../przyklady/01-wyprawa "$RUNNER_TEMP/nakladka-01"
          "$bin" --user-data-dir="$ud" --test-pdf "$RUNNER_TEMP/nakladka-01" "$RUNNER_TEMP/test/nakladka.pdf" | tee "$RUNNER_TEMP/test/nakladka.json"
          grep -q '"ok":true' "$RUNNER_TEMP/test/nakladka.json"
          grep -q '"zrodlo":"nakładka","wersja":"99.0.0"' "$RUNNER_TEMP/test/nakladka.json"
          test ! -e "$ud/kod/start-99.0.0"
          codesign --verify --deep --strict "dist/mac-arm64/KarKa.app"   # paczka nietknięta

      # Od tego miejsca do artefaktu KarKa – tylko przy wydaniu (main, tag v*, wydanie opublikowane, ręcznie; #101).
      - name: DMG (okno „przeciągnij do Programów”)
        if: github.event_name != 'pull_request'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg --arm64 --prepackaged "dist/mac-arm64/KarKa.app"

      - name: Sprawdzenie DMG
        if: github.event_name != 'pull_request'
        run: |
          ls -la dist/*.dmg
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" dist/KarKa.dmg
          ls -la "$RUNNER_TEMP/dmg"
          codesign --verify --deep --strict "$RUNNER_TEMP/dmg/KarKa.app"
          test -L "$RUNNER_TEMP/dmg/Applications"
          hdiutil detach "$RUNNER_TEMP/dmg"

      - name: Pliki aktualizacji (kod.zip, KarKa.zip, aktualizacja.json)
        if: github.event_name != 'pull_request'
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/mac-arm64/KarKa.app" dist/KarKa.zip
          node scripts/paczka-kodu.js dist
          cat dist/aktualizacja.json
          # Pełna paczka rozpakowana przez ditto ma ważny podpis (tak samo robi aktualizator).
          mkdir -p "$RUNNER_TEMP/rozpak" && ditto -x -k dist/KarKa.zip "$RUNNER_TEMP/rozpak"
          codesign --verify --deep --strict "$RUNNER_TEMP/rozpak/KarKa.app"

      - uses: actions/upload-artifact@v6
        if: github.event_name != 'pull_request'
        with:
          name: KarKa
          path: |
            app/dist/KarKa.dmg
            app/dist/KarKa.zip
            app/dist/kod.zip
            app/dist/aktualizacja.json
          compression-level: 0

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: wyniki-testow
          path: ${{ runner.temp }}/test

      - name: Czas przebiegu
        if: always()
        env:
          TRYB: ${{ steps.tryb.outputs.tryb }}
        run: |
          t=$(( $(date +%s) - START ))
          { echo; echo "**Cały przebieg** (tryb $TRYB, do kroku „Czas przebiegu”): $t s"; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$TRYB" = pr ] && [ "$t" -gt 600 ]; then echo "::warning::Przebieg PR trwał $t s (> 10 min)."; fi

      - name: Wydanie z numerem wersji (zmiana w main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wersja="v$(node -p "require('./package.json').version")"
          # Tytuł z nazwą serii. Uwaga: bash 3.2 na macOS przy „$nazwa”” wciągał bajty cudzysłowu do nazwy zmiennej
          # (w 0.5.0 wyszło „KarKa 0.5.0 „��”) – tytuł składa node.
          tytul="$(node -p "const p=require('./package.json'); 'KarKa ' + p.version + (p.nazwaWydania ? ' „' + p.nazwaWydania + '”' : '')")"
          if gh release view "$wersja" >/dev/null 2>&1; then
            echo "::warning::Wydanie $wersja już istnieje – podnieś wersję w app/package.json, żeby opublikować nowe DMG."
            exit 0
          fi
          # Wydanie powstaje od razu z plikiem, więc link „latest” w README nigdy nie wskazuje pustego wydania.
          gh release create "$wersja" dist/KarKa.dmg dist/KarKa.zip dist/kod.zip dist/aktualizacja.json --latest --target "$GITHUB_SHA" \
            --title "$tytul" --generate-notes \
            --notes "Aplikacja na macOS (Apple Silicon: M1–M4). Pierwsze uruchomienie: prawy przycisk → Otwórz (instrukcja: docs/aplikacja.md)."
          # Dawne wydanie „najnowsza” (nadpisywane przy każdej zmianie) nie jest już potrzebne.
          gh release delete najnowsza --yes --cleanup-tag 2>/dev/null || true

      - name: Wydanie – nowy tag v*
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/KarKa.dmg dist/KarKa.zip dist/kod.zip dist/aktualizacja.json \
            --title "KarKa $GITHUB_REF_NAME" \
            --notes "Aplikacja na macOS (Apple Silicon: M1–M4). Pierwsze uruchomienie: docs/aplikacja.md."

      - name: Wydanie – opublikowane na GitHubie (dołącza plik)
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/KarKa.dmg dist/KarKa.zip dist/kod.zip dist/aktualizacja.json --clobber
